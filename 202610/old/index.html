<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バイバイクラゲ</title>
<style>
  :root{
    --bg: #061826;
    --arena: #0a2438;
    --wall: #123449;
    --accent: #ff6b4a;
    --accent2: #4de3ff;
    --ink: #eaf6ff;
    --dim: #6f93a8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: "Courier New", ui-monospace, monospace;
    overflow:hidden; touch-action:none; user-select:none;
  }
  #app{
    position:relative; width:100vw; height:100vh; height:100dvh; display:flex; flex-direction:column;
  }
  #canvasWrap{
    position:relative; flex:1; display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  canvas{ background:var(--arena); display:block; touch-action:none; }
  #overlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; background:rgba(11,14,20,0.88); z-index:10;
    text-align:center; padding:20px;
  }
  #overlay.celebrate{ background:rgba(11,14,20,0.42); }
  #celebrateCanvas{
    display:none; margin:0 auto; border-radius:50%; border:3px solid rgba(255,255,255,0.4);
    background:rgba(11,14,20,0.3); box-shadow:0 0 22px rgba(77,227,255,0.3);
  }
  #overlay.mascot #celebrateCanvas{ display:block; }
  #overlay.perfect #celebrateCanvas{ border-color:#ffd54a; box-shadow:0 0 26px rgba(255,213,74,0.55); }
  #overlay.perfect h2{ color:#ffd54a; text-shadow:0 0 14px rgba(255,213,74,0.6); }
  .perfectBadge{
    display:inline-block; background:#ffd54a; color:#12161f; font-weight:bold; font-size:12px;
    letter-spacing:2px; padding:3px 12px; margin-bottom:4px;
  }
  #overlay.show{ display:flex; }
  #overlay h2{ margin:0; font-size:29px; letter-spacing:2px; line-height:1.4; }
  #overlay p{ margin:0; color:var(--dim); font-size:16px; line-height:1.7; }
  #overlay button{
    margin-top:6px; padding:10px 22px; background:var(--accent); color:#12161f;
    border:none; font-weight:bold; letter-spacing:1px; font-family:inherit; font-size:14px;
    cursor:pointer;
  }
  #langToggle{
    position:absolute; top:14px; right:14px; padding:4px 10px; font-size:11px;
    background:none; border:1px solid var(--dim); color:var(--dim); font-family:inherit;
    letter-spacing:1px; cursor:pointer; margin-top:0; opacity:0.72;
  }
  #overlay button.sub{
    margin-top:22px; background:none; color:var(--dim); border:1px solid var(--dim); font-size:13px; padding:8px 18px; /* extra gap from RETRY to avoid mis-taps */
  }
  #overlay table{ font-family:inherit; }
  #soundAsk{
    position:absolute; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(11,14,20,0.6); padding:20px;
  }
  #soundAsk.show{ display:flex; }
  #soundAskPanel{
    background:#12161f; border:1px solid var(--accent); padding:22px 20px 20px; text-align:center;
    max-width:320px; width:100%; box-shadow:0 0 22px rgba(77,227,255,0.25);
  }
  #soundAskTitle{ margin:0 0 8px; font-size:19px; font-weight:bold; color:#eaf6ff; }
  #soundAskSub{ margin:0 0 4px; font-size:13px; color:var(--dim); }
  #soundAskNote{ margin:0 0 16px; font-size:12px; color:var(--dim); opacity:0.8; }
  #soundAskBtns{ display:flex; gap:12px; justify-content:center; }
  #soundAskBtns button{
    min-width:110px; padding:12px 0; font-size:16px; font-weight:bold; letter-spacing:1px;
    font-family:inherit; cursor:pointer; background:none; color:var(--ink); border:1px solid var(--dim);
    transition:transform 0.12s, opacity 0.12s;
  }
  #soundAskBtns button.on{ background:var(--accent); color:#12161f; border-color:var(--accent); }
  #soundAskBtns button.picked{ transform:scale(1.08); box-shadow:0 0 16px rgba(77,227,255,0.6); }
  #soundAskBtns.chosen button:not(.picked){ opacity:0.35; }
  #overlay th, #overlay td{ padding:2px 6px; text-align:right; }
  #overlay th:first-child, #overlay td:first-child{ text-align:left; }
  #joyBase{
    position:absolute; width:110px; height:110px; border-radius:50%;
    border:2px solid rgba(58,214,255,0.35); background:rgba(58,214,255,0.06);
    display:none; z-index:6; pointer-events:none;
  }
  #joyKnob{
    position:absolute; width:46px; height:46px; border-radius:50%;
    background:rgba(58,214,255,0.55); left:32px; top:32px; pointer-events:none;
  }
  #topRightControls{
    position:absolute; top:8px; right:10px; z-index:20; display:flex; gap:6px;
  }
  #overlay.show ~ #topRightControls{ display:none; } /* pause is meaningless while any overlay screen is up, and would overlap the language toggle */
  #waveTransition{
    position:absolute; inset:0; z-index:60; pointer-events:none; display:none; overflow:hidden;
    background:linear-gradient(#0f3550, #061826); opacity:0;
  }
  #waveTransition.show{ display:block; pointer-events:auto; }
  #loadingCanvas{ position:absolute; inset:0; width:100%; height:100%; }
  #loadingText{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#eaf6ff; font-weight:bold; font-size:19px; letter-spacing:3px; z-index:2;
    animation: loadingBlink 0.9s steps(2, jump-none) infinite;
    text-shadow: 0 0 12px rgba(77,227,255,0.6); font-family:inherit;
  }
  @keyframes loadingBlink{ 50%{ opacity:0.15; } }
  #soundToggle{
    position:absolute; top:8px; left:10px; z-index:20; padding:8px 14px; font-size:15px;
    font-weight:bold; letter-spacing:1px; background:rgba(18,22,31,0.55); border:1px solid var(--wall);
    color:var(--ink); cursor:pointer; opacity:0.72; font-family:inherit;
    display:flex; align-items:center; gap:6px;
  }
  #soundToggle .icon{ font-size:15px; line-height:1; }
  #pauseToggle{
    background:rgba(18,22,31,0.55); border:1px solid var(--accent2);
    color:var(--ink); font-size:15px; font-weight:bold; padding:8px 14px; cursor:pointer;
    font-family:inherit; display:flex; align-items:center; gap:6px; letter-spacing:1px;
    opacity:0.72;
  }
  #pauseToggle .icon{ font-size:19px; line-height:1; }
  #howto{
    text-align:center; font-size:14px; color:var(--dim); flex-shrink:0;
    line-height:1.8; padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--wall);
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap">
    <canvas id="game"></canvas>
    <button id="soundToggle" aria-label="サウンド"><span class="icon">🔊</span><span id="soundToggleLabel">MUTE</span></button>
    <div id="overlay">
      <button id="langToggle">EN</button>
      <h2 id="overlayTitle">READY?</h2>
      <canvas id="celebrateCanvas" width="150" height="150"></canvas>
      <p id="overlayText"></p>
      <button id="overlayBtn">START</button>
      <button id="overlayBtn2" class="sub" style="display:none;"></button>
    </div>
    <div id="topRightControls">
      <button id="pauseToggle" aria-label="一時停止"><span class="icon">❚❚</span><span id="pauseToggleLabel">STOP</span></button>
    </div>
    <div id="soundAsk">
      <div id="soundAskPanel">
        <p id="soundAskTitle"></p>
        <p id="soundAskSub"></p>
        <p id="soundAskNote"></p>
        <div id="soundAskBtns">
          <button id="soundAskOn" class="on"></button>
          <button id="soundAskOff"></button>
        </div>
      </div>
    </div>
    <div id="waveTransition">
      <canvas id="loadingCanvas"></canvas>
      <div id="loadingText">TUNING UP</div>
    </div>
  </div>
  <div id="howto"></div>
  <div id="joyBase"><div id="joyKnob"></div></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Localization data (Japanese/English text used throughout the game)
// ---------------------------------------------------------------------------
const I18N = {
  ja: {
    lang_button_label: 'EN', // shows the language you'll switch TO

    controls_hint_html: '移動：スワイプ / ドラッグ / 十字キー<br>攻撃：移動後に手を離す',

    ready_title: 'バイバイクラゲ',
    start_btn: 'START',
    howto_html: `
      <div style="text-align:center; font-size:15px; line-height:1.6; max-width:300px; margin:0 auto;">
        <p style="margin:0 0 14px; color:#d4dee2;">水鉄砲で倍々クラゲを退治しよう！</p>
        <div style="text-align:left; font-size:14px; line-height:1.85;">
          <b style="color:#4de3ff;">操作</b><br>
          移動：スワイプ / ドラッグ / 十字キー<br>
          攻撃：移動後に手を離す<br><br>
          <b style="color:#4de3ff;">ルール</b><br>
          ・画面内を漂う全てのクラゲを倒せばクリア<br>
          ・倍々クラゲは水鉄砲に当たると大⇒中⇒小と分裂して小さくなる<br>
          ・クラゲに触れると痺れてライフを失う<br>
          ・1発で複数のクラゲを倒すと、一時的に攻撃力と移動速度がアップ
        </div>
      </div>`,

    stat_time_label: 'クリアタイム',
    stat_deaths_label: 'やられた数',
    stat_bonus_label: 'ボーナス回数',

    stage_clear_title: () => '縄張り奪還！',
    stage_reclaimed_text: (n) => `${n}つ目の縄張りを取り返した。`,
    stages_remaining_text: (remaining) => remaining === 1 ? '次が最後の縄張りだ！' : (remaining > 0 ? `残る縄張りはあと${remaining}つだ。` : ''),
    next_stage_btn: 'NEXT STAGE',

    milestone_title: () => '全ての縄張りを<br>奪還した！',
    perfect_title: '完全制覇！',
    perfect_text: '全ての縄張りを奪還した！',
    stats_table_headers: ['ステージ', 'クリアタイム', 'やられた数', 'ボーナス回数'],
    back_to_title_btn: 'タイトルへ戻る',
    retry_btn: 'RETRY',

    result_title: 'RESULT',
    result_message: (stageNum, clearedCount) => {
      const territoryPart = clearedCount > 0 ? `${clearedCount}つの縄張りを取り返した。` : 'まだ縄張りを取り返せていない。';
      return `ステージ${stageNum}のクラゲと戦った。<br>${territoryPart}`;
    },
    paused_title: 'PAUSED',
    paused_hint: '右上のボタンで再開',

    sound_ask_title: 'サウンドを鳴らしますか？',
    sound_ask_sub: 'あとから左上のボタンで変えられます',
    sound_ask_note: '※iPhoneはマナーモードだと鳴りません',
    sound_on: '♪ ON',
    sound_off: '♪ OFF',

    bonus_label: (secs) => `BONUS ${secs}s`,
    bonus_popup: (n) => `BONUS! ×${n}`,
  },

  en: {
    lang_button_label: '日本語',

    controls_hint_html: 'Move: Swipe / drag / arrows<br>Attack: Release after moving',

    ready_title: 'Squirtstrike',
    start_btn: 'START',
    howto_html: `
      <div style="text-align:center; font-size:15px; line-height:1.6; max-width:300px; margin:0 auto;">
        <p style="margin:0 0 14px; color:#d4dee2;">Squirt the jellyfish away!</p>
        <div style="text-align:left; font-size:14px; line-height:1.85;">
          <b style="color:#4de3ff;">Controls</b><br>
          Move: Swipe / drag / arrows<br>
          Attack: Release after moving<br><br>
          <b style="color:#4de3ff;">Rules</b><br>
          - Clear all jellyfish to win the stage<br>
          - Jellyfish split smaller each hit<br>
          - Touching one costs a life<br>
          - Multi-hits grant a temporary power &amp; speed boost
        </div>
      </div>`,

    stat_time_label: 'Time',
    stat_deaths_label: 'Deaths',
    stat_bonus_label: 'Bonus',

    stage_clear_title: () => 'Territory Reclaimed!',
    stage_reclaimed_text: (n) => `Territory #${n} reclaimed.`,
    stages_remaining_text: (remaining) => remaining === 1 ? 'This is the final territory!' : (remaining > 0 ? `${remaining} territories left to go.` : ''),
    next_stage_btn: 'NEXT STAGE',

    milestone_title: () => 'All territories reclaimed!',
    perfect_title: 'Perfect Clear!',
    perfect_text: 'All territories reclaimed!',
    stats_table_headers: ['Stage', 'Time', 'Deaths', 'Bonus'],
    back_to_title_btn: 'BACK TO TITLE',
    retry_btn: 'RETRY',

    result_title: 'RESULT',
    result_message: (stageNum, clearedCount) => {
      const territoryPart = clearedCount > 0 ? `Reclaimed ${clearedCount} ${clearedCount === 1 ? 'territory' : 'territories'}.` : 'No territories reclaimed yet.';
      return `Fought the jellyfish at stage ${stageNum}.<br>${territoryPart}`;
    },
    paused_title: 'PAUSED',
    paused_hint: 'Tap the button top-right to resume',

    sound_ask_title: 'Play with sound?',
    sound_ask_sub: 'You can change this later with the top-left button',
    sound_ask_note: 'On iPhone, turn off Silent Mode to hear it',
    sound_on: '♪ ON',
    sound_off: '♪ OFF',

    bonus_label: (secs) => `BONUS ${secs}s`,
    bonus_popup: (n) => `BONUS! x${n}`,
  },
};

(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const appEl = document.getElementById('app');
  const howtoEl = document.getElementById('howto');
  // ---------- Audio: everything below is synthesized with the Web Audio API - no sound
  // files, so this stays a single self-contained HTML file and adds zero network weight.
  let audioCtx = null;
  let soundOn = true; // toggled by #soundToggle; checked inside ensureAudio() so every sfx respects it in one place
  function ensureAudio() {
    if (!soundOn) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  // pre-warm the AudioContext on the very first touch/pointer interaction anywhere on the
  // page, rather than waiting specifically for the START button - creating an AudioContext
  // has a one-time hardware "spin-up" delay (worst on mobile Safari), so getting a head start
  // during the touch itself (which fires before the button's own click handler runs) means
  // by the time STARTs's confirm+countdown sounds are scheduled, the context is already warm
  // priming: schedule an actual (near-silent) tone as early as possible, not just resume() -
  // resume()/currentTime advancing only proves the context's internal clock is ticking, not
  // that audio has actually started flowing through the hardware output pipeline (the real
  // source of the cold-start lag on mobile Safari); actually playing something forces that
  // pipeline open well before the player's first *intended* sound (the confirm blip on START)
  function primeAudio() {
    const ac = ensureAudio();
    if (!ac) return;
    playTone(200, 'sine', 60, 0.008, 0);
  }
  window.addEventListener('pointerdown', primeAudio, { once: true, passive: true });
  window.addEventListener('touchstart', primeAudio, { once: true, passive: true });

  // ---------- First-start wave transition: masks the one-time AudioContext "cold start" cost
  // (worst on mobile Safari) behind a themed wipe-transition instead of a raw loading spinner,
  // so the very first play session - which may be someone's only session - opens cleanly.
  // Runs exactly once per page load; every later return-to-title/restart skips straight to
  // beginCountdown() since the AudioContext is already warm by then.
  let firstStartHandled = false;
  const waveEl = document.getElementById('waveTransition');
  const loadingCanvas = document.getElementById('loadingCanvas');
  const loadingCtx = loadingCanvas.getContext('2d');

  function setupLoadingSwarm() {
    const w = waveEl.clientWidth, h = waveEl.clientHeight;
    loadingCanvas.width = w; loadingCanvas.height = h;
    const baseR = Math.min(w, h) * 0.045;
    const specs = [
      { r: baseR * 2.2, gen: 0, count: 1 },
      { r: baseR * 1.5, gen: 1, count: 1 },
      { r: baseR * 1.0, gen: 2, count: 2 },
    ];
    const swarm = [];
    specs.forEach(spec => {
      for (let i = 0; i < spec.count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (w + h) * 0.05 + Math.random() * (w + h) * 0.03;
        swarm.push({
          x: spec.r + Math.random() * (w - spec.r * 2),
          y: spec.r + Math.random() * (h - spec.r * 2),
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          r: spec.r, gen: spec.gen, seed: Math.random() * 1000,
        });
      }
    });
    return { w, h, swarm };
  }
  // steps physics (movement, wall bounce, jellyfish-jellyfish elastic collision) and redraws -
  // reuses the real drawJellyfish/drawElectricRing/drawSparks, just targeting loadingCtx instead
  // of the main game canvas
  function stepAndDrawLoadingSwarm(state, dt) {
    const { w, h, swarm } = state;
    loadingCtx.clearRect(0, 0, w, h);
    swarm.forEach(j => {
      j.x += j.vx * dt; j.y += j.vy * dt;
      if (j.x < j.r) { j.x = j.r; j.vx *= -1; }
      if (j.x > w - j.r) { j.x = w - j.r; j.vx *= -1; }
      if (j.y < j.r) { j.y = j.r; j.vy *= -1; }
      if (j.y > h - j.r) { j.y = h - j.r; j.vy *= -1; }
    });
    for (let i = 0; i < swarm.length; i++) {
      for (let k = i + 1; k < swarm.length; k++) {
        const a = swarm[i], b = swarm[k];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        const minDist = a.r + b.r;
        if (dist > 0.0001 && dist < minDist) {
          const nx = dx / dist, ny = dy / dist;
          const aMass = a.r * a.r, bMass = b.r * b.r, totalMass = aMass + bMass;
          const overlap = minDist - dist;
          a.x -= nx * overlap * (bMass / totalMass); a.y -= ny * overlap * (bMass / totalMass);
          b.x += nx * overlap * (aMass / totalMass); b.y += ny * overlap * (aMass / totalMass);
          const avn = a.vx * nx + a.vy * ny, bvn = b.vx * nx + b.vy * ny;
          const aTx = a.vx - avn * nx, aTy = a.vy - avn * ny;
          const bTx = b.vx - bvn * nx, bTy = b.vy - bvn * ny;
          const newAvn = (avn * (aMass - bMass) + 2 * bMass * bvn) / totalMass;
          const newBvn = (bvn * (bMass - aMass) + 2 * aMass * avn) / totalMass;
          a.vx = aTx + newAvn * nx; a.vy = aTy + newAvn * ny;
          b.vx = bTx + newBvn * nx; b.vy = bTy + newBvn * ny;
        }
      }
    }
    swarm.forEach(j => {
      const c = JELLY_COLORS[j.gen];
      drawElectricRing(j.x, j.y, j.r, c.electric, 0.5, j.seed, loadingCtx);
      drawJellyfish(j.x, j.y, j.r, j.gen, 1, loadingCtx);
      drawSparks(j.x, j.y, j.r, c.electric, j.seed, loadingCtx);
    });
  }

  function playFirstStartTransition() {
    const COVER_MS = 200;   // fading in to fully visible
    const MIN_HOLD_MS = 0;  // extra hold once covered, only as long as audio isn't confirmed ready yet
    const MAX_HOLD_MS = 250;
    const REVEAL_MS = 220;  // fading back out, revealing the game underneath

    sfxConfirm();
    ensureAudio();
    const ac = audioCtx;
    const baselineTime = ac ? ac.currentTime : 0;

    waveEl.classList.add('show');
    const swarmState = setupLoadingSwarm();
    const t0 = performance.now();
    let lastFrameT = t0;
    let revealStarted = false;
    let holdEndsAt = null; // decided once we know whether audio is ready by the time cover finishes

    function frame(now) {
      const dt = Math.max(0, Math.min(0.05, (now - lastFrameT) / 1000));
      lastFrameT = now;
      stepAndDrawLoadingSwarm(swarmState, dt);
      const elapsed = now - t0;

      if (!revealStarted) {
        if (elapsed < COVER_MS) {
          waveEl.style.opacity = elapsed / COVER_MS;
          requestAnimationFrame(frame);
          return;
        }
        // fully covered - decide how much longer (if any) to hold based on audio readiness
        if (holdEndsAt === null) {
          const audioLooksReady = ac && ac.state === 'running' && (ac.currentTime - baselineTime) > 0.03;
          holdEndsAt = t0 + COVER_MS + (audioLooksReady ? MIN_HOLD_MS : MAX_HOLD_MS);
        }
        const audioReadyNow = ac && ac.state === 'running' && (ac.currentTime - baselineTime) > 0.03;
        if (now < holdEndsAt && !audioReadyNow) {
          waveEl.style.opacity = 1;
          requestAnimationFrame(frame);
          return;
        }
        // proceed to reveal: this is the moment the actual game/countdown begins, timed so any
        // residual audio latency is hidden behind the still-opaque loading screen
        revealStarted = true;
        beginCountdown();
        requestAnimationFrame(frame);
        return;
      }

      const revealElapsed = elapsed - (holdEndsAt - t0);
      if (revealElapsed < REVEAL_MS) {
        waveEl.style.opacity = 1 - revealElapsed / REVEAL_MS;
        requestAnimationFrame(frame);
      } else {
        waveEl.style.opacity = 0;
        waveEl.classList.remove('show');
      }
    }
    requestAnimationFrame(frame);
  }

  // freq: Hz. type: 'sine'|'triangle'|'square'|'sawtooth'. duration: ms. volume: 0-1. delay: seconds from now.
  function playTone(freq, type, duration, volume, delay) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const dur = duration / 1000;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  // like playTone but the pitch slides linearly from freq1 to freq2 over the duration
  function playSlide(freq1, freq2, type, duration, volume, delay) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const dur = duration / 1000;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq1, t0);
    osc.frequency.linearRampToValueAtTime(freq2, t0 + dur);
    gain.gain.setValueAtTime(0, t0);

    for (let i = 0; i < steps; i++) {

      const off = st + (1 / gateRate) * 0.5;
      gain.gain.setValueAtTime(0, st);
      gain.gain.linearRampToValueAtTime(volume * (1 - i / steps * 0.6), on);

    gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain);

    osc.stop(t0 + dur + 0.02); lfo.stop(t0 + dur + 0.02);
