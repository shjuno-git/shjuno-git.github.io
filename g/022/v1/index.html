<script>

const I18N = {

  en: {

    howto: {
      intro: 'Squirt the jellyfish away!',
      sections: [
        { head: 'Controls', lines: ['Move: Swipe / drag / arrows', 'Attack: Release after moving'] },
        { head: 'Rules', lines: [
          '- Clear all jellyfish to win the stage',
          '- Jellyfish split smaller each hit',

          '- Multi-hits grant a temporary power & speed boost',
        ] },
      ],
    },

    stat_time_label: 'Time',
    stat_deaths_label: 'Deaths',
    stat_bonus_label: 'Bonus',

    stage_clear_title: () => 'Territory Reclaimed!',
    stage_reclaimed_text: (n) => `Territory #${n} reclaimed.`,
    stages_remaining_text: (remaining) => remaining === 1 ? 'This is the final territory!' : (remaining > 0 ? `${remaining} territories left to go.` : ''),
    next_stage_btn: 'NEXT STAGE',

    milestone_title: () => ['All territories', 'reclaimed!'],
    perfect_title: 'Perfect Clear!',
    perfect_text: 'All territories reclaimed!',
    stats_table_headers: ['Stage', 'Time', 'Deaths', 'Bonus'],
    back_to_title_btn: 'BACK TO TITLE',
    retry_btn: 'RETRY',

    result_title: 'RESULT',
    result_message: (stageNum, clearedCount) => {
      const territoryPart = clearedCount > 0 ? `Reclaimed ${clearedCount} ${clearedCount === 1 ? 'territory' : 'territories'}.` : 'No territories reclaimed yet.';
      return [`Fought the jellyfish at stage ${stageNum}.`, territoryPart];
    },
    paused_title: 'PAUSED',
    paused_hint: 'Tap the button top-right to resume',

    sound_ask_title: 'Play with sound?',
    sound_ask_sub: 'You can change this later with the top-left button',
    sound_ask_note: 'On iPhone, turn off Silent Mode to hear it',
    sound_on: '♪ ON',
    sound_off: '♪ OFF',

    bonus_label: (secs) => `BONUS ${secs}s`,
    bonus_popup: (n) => `BONUS! x${n}`,

(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  // ---------- Audio: everything below is synthesized with the Web Audio API - no sound
  // files, so this stays a single self-contained HTML file and adds zero network weight.
  let audioCtx = null;
  let soundOn = true; // toggled by #soundToggle; checked inside ensureAudio() so every sfx respects it in one place
  function ensureAudio() {
    if (!soundOn) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  // pre-warm the AudioContext on the very first touch/pointer interaction anywhere on the
  // page, rather than waiting specifically for the START button - creating an AudioContext
  // has a one-time hardware "spin-up" delay (worst on mobile Safari), so getting a head start
  // during the touch itself (which fires before the button's own click handler runs) means
  // by the time STARTs's confirm+countdown sounds are scheduled, the context is already warm
  // priming: schedule an actual (near-silent) tone as early as possible, not just resume() -
  // resume()/currentTime advancing only proves the context's internal clock is ticking, not
  // that audio has actually started flowing through the hardware output pipeline (the real
  // source of the cold-start lag on mobile Safari); actually playing something forces that
  // pipeline open well before the player's first *intended* sound (the confirm blip on START)
  function primeAudio() {
    const ac = ensureAudio();
    if (!ac) return;
    playTone(200, 'sine', 60, 0.008, 0);
  }
  window.addEventListener('pointerdown', primeAudio, { once: true, passive: true });
  window.addEventListener('touchstart', primeAudio, { once: true, passive: true });

  // ---------- First-start wave transition: masks the one-time AudioContext "cold start" cost
  // (worst on mobile Safari) behind a themed wipe-transition instead of a raw loading spinner,
  // so the very first play session - which may be someone's only session - opens cleanly.
  // Runs exactly once per page load; every later return-to-title/restart skips straight to
  // beginCountdown() since the AudioContext is already warm by then.
  let firstStartHandled = false;
  let waveVisible = false, waveOpacity = 0, waveSwarm = null; // drawn by drawUi() on top of everything in the play area

  function setupLoadingSwarm() {
    const w = W, h = wrapH;
    const baseR = Math.min(w, h) * 0.045;
    const specs = [
      { r: baseR * 2.2, gen: 0, count: 1 },
      { r: baseR * 1.5, gen: 1, count: 1 },
      { r: baseR * 1.0, gen: 2, count: 2 },
    ];
    const swarm = [];
    specs.forEach(spec => {
      for (let i = 0; i < spec.count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (w + h) * 0.05 + Math.random() * (w + h) * 0.03;
        swarm.push({
          x: spec.r + Math.random() * (w - spec.r * 2),
          y: spec.r + Math.random() * (h - spec.r * 2),
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          r: spec.r, gen: spec.gen, seed: Math.random() * 1000,
        });
      }
    });
    return { w, h, swarm };
  }
  // steps physics (movement, wall bounce, jellyfish-jellyfish elastic collision); drawing happens
  // separately in drawLoadingSwarm() so it can be layered by drawUi()
  function stepLoadingSwarm(state, dt) {
    const { w, h, swarm } = state;
    swarm.forEach(j => {
      j.x += j.vx * dt; j.y += j.vy * dt;
      if (j.x < j.r) { j.x = j.r; j.vx *= -1; }
      if (j.x > w - j.r) { j.x = w - j.r; j.vx *= -1; }
      if (j.y < j.r) { j.y = j.r; j.vy *= -1; }
      if (j.y > h - j.r) { j.y = h - j.r; j.vy *= -1; }
    });
    for (let i = 0; i < swarm.length; i++) {
      for (let k = i + 1; k < swarm.length; k++) {
        const a = swarm[i], b = swarm[k];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        const minDist = a.r + b.r;
        if (dist > 0.0001 && dist < minDist) {
          const nx = dx / dist, ny = dy / dist;
          const aMass = a.r * a.r, bMass = b.r * b.r, totalMass = aMass + bMass;
          const overlap = minDist - dist;
          a.x -= nx * overlap * (bMass / totalMass); a.y -= ny * overlap * (bMass / totalMass);
          b.x += nx * overlap * (aMass / totalMass); b.y += ny * overlap * (aMass / totalMass);
          const avn = a.vx * nx + a.vy * ny, bvn = b.vx * nx + b.vy * ny;
          const aTx = a.vx - avn * nx, aTy = a.vy - avn * ny;
          const bTx = b.vx - bvn * nx, bTy = b.vy - bvn * ny;
          const newAvn = (avn * (aMass - bMass) + 2 * bMass * bvn) / totalMass;
          const newBvn = (bvn * (bMass - aMass) + 2 * aMass * avn) / totalMass;
          a.vx = aTx + newAvn * nx; a.vy = aTy + newAvn * ny;
          b.vx = bTx + newBvn * nx; b.vy = bTy + newBvn * ny;
        }
      }
    }
  }
  // reuses the real drawJellyfish/drawElectricRing/drawSparks
  function drawLoadingSwarm(state) {
    state.swarm.forEach(j => {
      const c = JELLY_COLORS[j.gen];
      drawElectricRing(j.x, j.y, j.r, c.electric, 0.5, j.seed, ctx);
      drawJellyfish(j.x, j.y, j.r, j.gen, 1, ctx);
      drawSparks(j.x, j.y, j.r, c.electric, j.seed, ctx);
    });
  }

  function playFirstStartTransition() {
    const COVER_MS = 200;   // fading in to fully visible
    const MIN_HOLD_MS = 0;  // extra hold once covered, only as long as audio isn't confirmed ready yet
    const MAX_HOLD_MS = 250;
    const REVEAL_MS = 220;  // fading back out, revealing the game underneath

    sfxConfirm();
    ensureAudio();
    const ac = audioCtx;
    const baselineTime = ac ? ac.currentTime : 0;

    waveVisible = true;
    waveOpacity = 0;
    waveSwarm = setupLoadingSwarm();
    const t0 = performance.now();
    let lastFrameT = t0;
    let revealStarted = false;
    let holdEndsAt = null; // decided once we know whether audio is ready by the time cover finishes

    function frame(now) {
      const dt = Math.max(0, Math.min(0.05, (now - lastFrameT) / 1000));
      lastFrameT = now;
      stepLoadingSwarm(waveSwarm, dt);
      const elapsed = now - t0;

      if (!revealStarted) {
        if (elapsed < COVER_MS) {
          waveOpacity = elapsed / COVER_MS;
          requestAnimationFrame(frame);
          return;
        }
        // fully covered - decide how much longer (if any) to hold based on audio readiness
        if (holdEndsAt === null) {
          const audioLooksReady = ac && ac.state === 'running' && (ac.currentTime - baselineTime) > 0.03;
          holdEndsAt = t0 + COVER_MS + (audioLooksReady ? MIN_HOLD_MS : MAX_HOLD_MS);
        }
        const audioReadyNow = ac && ac.state === 'running' && (ac.currentTime - baselineTime) > 0.03;
        if (now < holdEndsAt && !audioReadyNow) {
          waveOpacity = 1;
          requestAnimationFrame(frame);
          return;
        }
        // proceed to reveal: this is the moment the actual game/countdown begins, timed so any
        // residual audio latency is hidden behind the still-opaque loading screen
        revealStarted = true;
        beginCountdown();
        requestAnimationFrame(frame);
        return;
      }

      const revealElapsed = elapsed - (holdEndsAt - t0);
      if (revealElapsed < REVEAL_MS) {
        waveOpacity = 1 - revealElapsed / REVEAL_MS;
        requestAnimationFrame(frame);
      } else {
        waveOpacity = 0;
        waveVisible = false;
      }
    }
    requestAnimationFrame(frame);
  }

  // freq: Hz. type: 'sine'|'triangle'|'square'|'sawtooth'. duration: ms. volume: 0-1. delay: seconds from now.
  function playTone(freq, type, duration, volume, delay) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const dur = duration / 1000;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  // like playTone but the pitch slides linearly from freq1 to freq2 over the duration
  function playSlide(freq1, freq2, type, duration, volume, delay) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const dur = duration / 1000;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq1, t0);
    osc.frequency.linearRampToValueAtTime(freq2, t0 + dur);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  // a short run of notes, e.g. for the bonus/clear fanfares. notes = [{freq, dur, delay}]
  function playSequence(notes, type, volume) {
    notes.forEach(n => playTone(n.freq, type, n.dur, n.vol !== undefined ? n.vol : volume, n.delay));
  }
  // filtered white-noise burst with the bandpass filter sweeping down - a "shu" spray texture,
  // used as the base of the fire sound (much closer to a water squirt than a pure tone)
  function playNoiseSweep(freqHigh, freqLow, duration, volume, delay, q) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const dur = duration / 1000;
    const bufferSize = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ac.createBufferSource();
    noise.buffer = buffer;
    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = q || 6;
    filter.frequency.setValueAtTime(freqHigh, t0);
    filter.frequency.exponentialRampToValueAtTime(freqLow, t0 + dur);
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ac.destination);
    noise.start(t0);
    noise.stop(t0 + dur + 0.02);
  }
  // a light, low, narrow-band noise "tok" - much softer/lower than playNoiseSweep, used for the
  // countdown ticks instead of a bright/harsh click
  function playSoftTick(volume, brightness, delay) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const dur = 0.045;
    const bufferSize = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ac.createBufferSource();
    noise.buffer = buffer;
    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 3;
    filter.frequency.value = 500 + brightness * 700; // stays low/soft, brightens only a little
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ac.destination);
    noise.start(t0);
    noise.stop(t0 + dur + 0.02);
  }
  // 2-operator FM bell - used for the START! jingle
  function playFMBell(freq, modRatio, modDepth, duration, volume, delay) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const dur = duration / 1000;
    const carrier = ac.createOscillator();
    const modulator = ac.createOscillator();
    const modGain = ac.createGain();
    carrier.type = 'sine';
    modulator.type = 'sine';
    modulator.frequency.value = freq * modRatio;
    modGain.gain.setValueAtTime(modDepth, t0);
    modGain.gain.exponentialRampToValueAtTime(1, t0 + dur); // modulation decays -> bell-like
    modulator.connect(modGain);
    modGain.connect(carrier.frequency);
    carrier.frequency.value = freq;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    carrier.connect(gain);
    gain.connect(ac.destination);
    carrier.start(t0); modulator.start(t0);
    carrier.stop(t0 + dur + 0.02); modulator.stop(t0 + dur + 0.02);
  }
  // a mid-tone that gates rapidly on/off while sliding down in pitch - a "stuttering electric
  // current" texture, used as the main/readable layer of the hurt sound
  function playStutterSlide(freq1, freq2, type, duration, volume, gateRate) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime;
    const dur = duration / 1000;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq1, t0);
    osc.frequency.linearRampToValueAtTime(freq2, t0 + dur);
    osc.connect(gain);
    gain.connect(ac.destination);
    const steps = Math.floor(dur * gateRate);
    for (let i = 0; i < steps; i++) {
      const st = t0 + i / gateRate;
      const on = st + 0.005;
      const off = st + (1 / gateRate) * 0.5;
      gain.gain.setValueAtTime(0, st);
      gain.gain.linearRampToValueAtTime(volume * (1 - i / steps * 0.6), on);
      gain.gain.linearRampToValueAtTime(0, off);
    }
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  // a low tone with fast pitch vibrato, also sliding down - a quieter "numb/shock" layer that
  // lingers under (and slightly past) the stutter layer above
  function playVibratoSlide(freq1, freq2, type, duration, volume, vibRate, vibDepth, delay) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const dur = duration / 1000;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq1, t0);
    osc.frequency.linearRampToValueAtTime(freq2, t0 + dur);
    const lfo = ac.createOscillator();
    const lfoGain = ac.createGain();
    lfo.frequency.value = vibRate;
    lfoGain.gain.value = vibDepth;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(t0); lfo.start(t0);
    osc.stop(t0 + dur + 0.02); lfo.stop(t0 + dur + 0.02);
  }
  // ---------- Sound effects (Cmaj pentatonic: C5=523 D5=587 E5=659 G5=784 A5=880 C6=1047;
  // F5=698/B5=988 only ever used as brief passing tones, never as a note you land on) ----------
  // C3: a tiny rising pre-chirp (the "flick" of pursing the mouth) immediately followed by a
  // filtered noise burst sweeping downward (the actual water spray) - chosen for sounding like
  // a squirt rather than a laser, while still having enough character to not feel flat on repeat
  function sfxFire() {
    playSlide(600, 1400, 'sine', 15, 0.16, 0);
    playNoiseSweep(4000, 500, 90, 0.32, 0.014);
  }
  // B2: a short crack followed by two slightly detuned echoing blips - reads as "one thing
  // breaking into pieces" rather than a plain hit confirmation
  function sfxHit() {
    playNoiseSweep(3500, 2000, 25, 0.24);
    playTone(880, 'sine', 60, 0.14, 0.03);
    playTone(784, 'sine', 60, 0.12, 0.06);
  }
  // C2: the smallest jellyfish's final hit - a short evaporating sizzle with a fading high
  // shimmer layered on top, distinct from the regular mid-split hit sound
  function sfxDissolve() {
    playNoiseSweep(6000, 1500, 220, 0.18, 0, 3);
    playSlide(2500, 4000, 'sine', 200, 0.08, 0);
  }
  // stuttering "electric current" mid-tone (readable hit) + a quieter low vibrato that lingers
  // a bit longer underneath (the numb/shock texture) - both slide downward together
  function sfxHurt() {
    playStutterSlide(650, 280, 'square', 220, 0.2, 22);
    playVibratoSlide(160, 70, 'sawtooth', 500, 0.08, 35, 20, 0);
  }
