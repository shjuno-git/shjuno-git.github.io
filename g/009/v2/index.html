<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
	<meta name="description" content="3回タップで高さ・横・傾きを決めて出撃！狙った的だけを吹き飛ばす1分ミニゲーム。">
	<title>Fish and Chips</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #1b1b1f;
		}
		/* 画面いっぱいに置いて、canvas 側で縦横比を保つ */
		#game-wrap {
			position: absolute;
			inset: 0;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		/* ゲームは 9:16 で作ってあるので、引き伸ばさず比を保って収める */
		#unity-canvas {
			display: block;
			aspect-ratio: 9 / 16;
			width: auto;
			height: 100%;
			max-width: 100%;
			max-height: 100%;
			background: #1b1b1f;
		}
		/* 読み込み中の表示。画像を使わず文字だけで済ませる */
		#loading {
			position: absolute;
			color: #d8d8dc;
			font: 14px system-ui, sans-serif;
			letter-spacing: .08em;
		}
	</style>
</head>

<body>
	<div id="game-wrap">
		<canvas id="unity-canvas" tabindex="-1"></canvas>
		<div id="loading">Loading… 0%</div>
	</div>
	<script src="Build/WebGL.loader.js"></script>
	<script>
		(function () {
			var canvas = document.querySelector("#unity-canvas");
			var loading = document.querySelector("#loading");

			createUnityInstance(canvas, {
				dataUrl: "Build/WebGL.data.unityweb",
				frameworkUrl: "Build/WebGL.framework.js.unityweb",
				codeUrl: "Build/WebGL.wasm.unityweb",
				streamingAssetsUrl: "StreamingAssets",
				companyName: "shjuno",
				productName: "Fish and Chips",
				productVersion: "1.0",
			}, function (progress) {
				loading.textContent = "Loading… " + Math.round(progress * 100) + "%";
			}).then(function () {
				loading.remove();
			}).catch(function (e) {
				loading.textContent = "読み込みに失敗しました";
				// 失敗の詳細は開発時だけ見られればよい
				if (window.console) console.error(e);
			});
		})();
	</script>
</body>

</html>
