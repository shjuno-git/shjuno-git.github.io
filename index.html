<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>シシノノ ミニゲーム集</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 24px 16px 48px;
			background: #333344;
			color: #eee;
			font-family: -apple-system, "Hiragino Sans", "Yu Gothic", Meiryo, Arial, sans-serif;
		}

		h1 {
			font-size: 1.3em;
			text-align: center;
			margin-bottom: 24px;
		}

		ul {
			list-style: none;
			margin: 0 auto;
			padding: 0;
			max-width: 480px;
		}

		li {
			background: #44445a;
			border-radius: 8px;
			padding: 14px 16px;
			margin-bottom: 12px;
		}

		.title {
			font-weight: bold;
			margin-bottom: 4px;
		}

		.desc {
			font-size: 0.85em;
			opacity: 0.85;
			margin-bottom: 8px;
		}

		.links a {
			color: #9fd3ff;
			text-decoration: none;
			font-size: 0.85em;
			margin-right: 12px;
		}

		.links a:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>
	<h1>シシノノ ミニゲーム集</h1>
	<ul>
		<li>
			<div class="title">５円はスルー、ボールは打つ（202501）</div>
			<div class="desc">ボールを打ち返して５円玉を集めよう！</div>
			<div class="links">
				<a href="202501/">遊ぶ（リメイク版）</a>
				<a href="202501/original/">初代版を見る（2025年1月公開）</a>
			</div>
		</li>
	</ul>
</body>

</html>
