<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>シシノノ ミニゲーム集</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 24px 16px 48px;
			background: #333344;
			color: #eee;
			font-family: -apple-system, "Hiragino Sans", "Yu Gothic", Meiryo, Arial, sans-serif;
		}

		h1 {
			font-size: 1.3em;
			text-align: center;
			margin-bottom: 24px;
		}

		ul {
			list-style: none;
			margin: 0 auto;
			padding: 0;
			max-width: 480px;
		}

		li {
			background: #44445a;
			border-radius: 8px;
			padding: 14px 16px;
			margin-bottom: 12px;
		}

		.thumb-link {
			display: block;
			margin-bottom: 10px;
			line-height: 0;
		}

		.thumb {
			display: block;
			width: 100%;
			height: auto;
			border-radius: 6px;
		}

		.title {
			font-weight: bold;
			margin-bottom: 4px;
		}

		.desc {
			font-size: 0.85em;
			opacity: 0.85;
			margin-bottom: 10px;
		}

		.play-btn {
			display: inline-block;
			background: #4a90d9;
			color: #fff;
			text-decoration: none;
			font-weight: bold;
			padding: 8px 20px;
			border-radius: 20px;
		}

		.play-btn:hover {
			background: #5aa0e9;
		}

		.original-link {
			display: block;
			margin-top: 8px;
			color: #9fd3ff;
			opacity: 0.7;
			text-decoration: none;
			font-size: 0.7em;
		}

		.original-link:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>
	<h1>シシノノ ミニゲーム集</h1>
	<ul>
		<li>
			<a class="thumb-link" href="202501/">
				<img class="thumb" src="images/thumbnail/linkcard_goen.png" alt="５円はスルー、ボールは打つ！">
			</a>
			<div class="title">５円はスルー、ボールは打つ（202501）</div>
			<div class="desc">ボールを打ち返して５円玉を集めよう！</div>
			<a class="play-btn" href="202501/">遊ぶ</a>
			<a class="original-link" href="202501/original/">初代版を見る（2025年1月公開）</a>
		</li>
	</ul>
</body>

</html>
