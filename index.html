<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>shjuno ミニゲーム集</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 24px 16px 48px;
			background: #333344;
			color: #eee;
			font-family: -apple-system, "Hiragino Sans", "Yu Gothic", Meiryo, Arial, sans-serif;
		}

		h1 {
			font-size: 1.3em;
			text-align: center;
			margin-bottom: 16px;
		}

		.filter-bar {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 8px;
			max-width: 480px;
			margin: 0 auto 24px;
		}

		.filter-btn {
			background: rgba(255,255,255,0.08);
			color: #cdd3e0;
			border: 1px solid rgba(255,255,255,0.2);
			font: inherit;
			font-size: 0.8em;
			padding: 5px 14px;
			border-radius: 14px;
			cursor: pointer;
		}

		.filter-btn:hover {
			background: rgba(255,255,255,0.16);
		}

		.filter-btn.active {
			background: #4a90d9;
			border-color: #4a90d9;
			color: #fff;
			font-weight: bold;
		}

		ul {
			list-style: none;
			margin: 0 auto;
			padding: 0;
			max-width: 480px;
		}

		li {
			background: #44445a;
			border-radius: 8px;
			padding: 14px 16px;
			margin-bottom: 12px;
		}

		.card-link {
			display: block;
			color: inherit;
			text-decoration: none;
		}

		.thumb {
			display: block;
			width: 100%;
			height: auto;
			border-radius: 6px;
			margin-bottom: 10px;
		}

		.title {
			font-weight: bold;
			margin-bottom: 4px;
		}

		.card-link:hover .title {
			color: #9fd3ff;
			text-decoration: underline;
		}

		.desc {
			font-size: 0.85em;
			opacity: 0.85;
		}

		.sub-links {
			margin-top: 10px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
		}

		.tags {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
		}

		.tag {
			background: rgba(255,255,255,0.1);
			color: #cdd3e0;
			border: none;
			font: inherit;
			font-size: 0.7em;
			padding: 3px 10px;
			border-radius: 10px;
			cursor: pointer;
		}

		.tag:hover {
			background: rgba(255,255,255,0.2);
		}

		li.hidden {
			display: none;
		}

		.original-link {
			color: #9fd3ff;
			opacity: 0.7;
			text-decoration: none;
			font-size: 0.7em;
		}

		.original-link:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>
	<h1>shjuno ミニゲーム集</h1>
	<div class="filter-bar" id="filterBar"></div>
	<ul id="gameList">
		<li data-genres="野球">
			<a class="card-link" href="202501/">
				<img class="thumb" src="images/thumbnail/linkcard_goen.png" alt="５円はスルー、ボールは打つ！">
				<div class="title">５円はスルー、ボールは打つ（202501）</div>
				<div class="desc">ボールを打ち返して５円玉を集めよう！</div>
			</a>
			<div class="sub-links">
				<div class="tags">
					<button type="button" class="tag" data-genre="野球">野球</button>
				</div>
				<a class="original-link" href="202501/original/">旧版で遊ぶ</a>
			</div>
		</li>
	</ul>
	<script>
		(function () {
			const list = document.getElementById("gameList");
			const items = Array.from(list.querySelectorAll("li"));
			const filterBar = document.getElementById("filterBar");

			const genres = [];
			items.forEach((li) => {
				(li.dataset.genres || "").split(",").filter(Boolean).forEach((g) => {
					if (!genres.includes(g)) genres.push(g);
				});
			});

			function applyFilter(genre) {
				items.forEach((li) => {
					const list = (li.dataset.genres || "").split(",").filter(Boolean);
					li.classList.toggle("hidden", !(genre === "all" || list.includes(genre)));
				});
				filterBar.querySelectorAll(".filter-btn").forEach((btn) => {
					btn.classList.toggle("active", btn.dataset.genre === genre);
				});
			}

			function makeFilterBtn(genre, label) {
				const btn = document.createElement("button");
				btn.type = "button";
				btn.className = "filter-btn";
				btn.dataset.genre = genre;
				btn.textContent = label;
				btn.addEventListener("click", () => applyFilter(genre));
				return btn;
			}

			filterBar.appendChild(makeFilterBtn("all", "すべて"));
			genres.forEach((g) => filterBar.appendChild(makeFilterBtn(g, g)));
			applyFilter("all");

			list.querySelectorAll(".tag[data-genre]").forEach((tagEl) => {
				tagEl.addEventListener("click", () => {
					applyFilter(tagEl.dataset.genre);
					filterBar.scrollIntoView({ behavior: "smooth", block: "start" });
				});
			});
		})();
	</script>
</body>

</html>
