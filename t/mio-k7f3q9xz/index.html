<script>
'use strict';
// ===== 基本 =====
const W = 720, H = 1280;
const DEV = true; // 試作中だけ: タイトルに「記録をリセット」。公開時は false
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const JP = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';
const MONO = '"BIZ UDGothic","Osaka-Mono","MS Gothic","Noto Sans Mono CJK JP",monospace';
const C = {
  bg: '#0b1018', panel: '#111925', line: '#25344a', text: '#e2e9f3', dim: '#7f8da3', faint: '#4a5872',
  phrase: '#8fd3ff', sel: '#1f4a6b', log: '#9fe0b8', memo: '#ffd98a', bad: '#ff9a8a', you: '#ffc9a0', mio: '#a9c6ff',
  nar: '#a7b3c6' // 会話画面の地の文(dim だと暗い画面で読めない)
};
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const iw = innerWidth, ih = innerHeight;
  const s = Math.min(iw / W, ih / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = Math.floor((iw - cw) / 2) + 'px'; cv.style.top = Math.floor((ih - ch) / 2) + 'px';
  cv.width = Math.floor(cw * dpr); cv.height = Math.floor(ch * dpr);

addEventListener('resize', resize); resize();

// ===== 保存 =====
// v6: 結末ごとに断片3つ。v5(mio_proto_v1)の結末は断片として引き継ぐ
const SAVE_KEY = 'mio_proto_v6';
const EIDS = ['silence', 'arrive', 'truth', 'confess', 'morning'];
let save = { frags: {}, wakes: 0, runs: 0, lastVar: {}, lastEnd: '' };
EIDS.forEach(id => { save.frags[id] = [0, 0, 0]; });
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s) { Object.assign(save, s); EIDS.forEach(id => { if (!save.frags[id]) save.frags[id] = [0, 0, 0]; }); }
  else {
    const o = JSON.parse(localStorage.getItem('mio_proto_v1'));
    if (o) {
      save.wakes = o.wakes || 0; save.runs = o.runs || 0;
      const map = { silence: ['silence', 0], arrive: ['arrive', 0], truth: ['truth', 0], order: ['confess', 0], name: ['confess', 1] };
      (o.endings || []).forEach(e => { const m = map[e]; if (m) save.frags[m[0]][m[1]] = 1; });
    }
  }
} catch (e) {}
// 既読: 数字を # にそろえた文の短い印を保存する(覚醒回数などが変わっても既読のまま)
let READ = null;
const readKey = L => { let h = 5381; const t = L.w + ':' + L.t.replace(/[0-9０-９,]+/g, '#'); for (let i = 0; i < t.length; i++) h = (h * 33 + t.charCodeAt(i)) >>> 0; return h.toString(36); };
let READSRC = null; // 記録のリセットで save が替わったら読み直す
const readSet = () => { if (READSRC !== save) { READ = new Set(save.read || []); READSRC = save; } return READ; };
function isRead(L) { return readSet().has(readKey(L)); }
function markRead(L) { readSet(); const k = readKey(L); if (!READ.has(k)) { READ.add(k); save.read = [...READ]; persist(); } }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const seenEnd = id => save.frags[id].some(Boolean);
const fragCount = () => EIDS.reduce((n, id) => n + save.frags[id].filter(Boolean).length, 0);
// 心残りに並べる結末(隠しの結末は、見るまで行ごと出さない)
// near: 見る前でも、たどり着ける所まで来たら「？？？」の行で先に出す(最後の朝)
const shownEnds = () => ENDINGS.filter(e => !e.hidden || seenEnd(e.id) || (e.near && e.near()));
// 時間の上限: 表示は5回で止める。最後の朝を見たあとは「もしもの朝」で、そこで止まる(wakeFix)
const wakeNo = () => save.wakeFix || 2 + save.wakes; // 上限なし(眠りに戻された回数とそろえる)

// ===== 音 =====
// 音は全部 WebAudio で作る(素材ファイルなし)。試聴ページ sound_audition.html で選んだ案
let ac = null, muted = false, verb = null, noiseBuf = null;
function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      // 小さな残響(雑音を減衰させたインパルス)と、クリック用の雑音
      verb = ac.createConvolver();
      const len = ac.sampleRate * 1.8, ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
      verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.3; verb.connect(vg); vg.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') {
    ac.resume();
    // iOS: 無音を1つ鳴らすと、指を離した時点で音が出せる状態になる
    try { const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0); } catch (e) {}
  }
}
// 高い音ほど小さく、角のある波形はさらに小さく(高い音が耳に残らないように)
const tame = (f, type) => (f > 600 ? Math.pow(600 / f, 0.8) : 1) * (type === 'square' || type === 'sawtooth' ? 0.6 : 1);
function tone(f, d, type, vol, slide, o) {
  if (muted || !ac) return;
  o = o || {};
  const t = ac.currentTime + (o.at || 0), osc = ac.createOscillator(), g = ac.createGain();
  osc.type = type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime((vol || 0.04) * tame(f, type), t + (o.atk || 0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  let node = osc;
  if (o.lp || o.bp) { const fl = ac.createBiquadFilter(); fl.type = o.lp ? 'lowpass' : 'bandpass'; fl.frequency.value = o.lp || o.bp; fl.Q.value = o.q || 1; osc.connect(fl); node = fl; }
  node.connect(g); g.connect(ac.destination);
  if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(verb); }
  if (o.echo) { const dl = ac.createDelay(), fb = ac.createGain(), wet = ac.createGain(); dl.delayTime.value = o.echo; fb.gain.value = 0.35; wet.gain.value = 0.5; g.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(ac.destination); }
  osc.start(t); osc.stop(t + d + 0.05);
}
function noise(d, vol, type, freq, o) {
  if (muted || !ac) return;
  o = o || {};
  const t = ac.currentTime + (o.at || 0), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.frequency.value = freq; fl.Q.value = o.q || 1;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * tame(freq), t + (o.atk || 0.002)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
}
// 文字送りの音(話し手ごと。地の文は無音)
const TICK = {
  mio: () => tone(st ? 620 - st.alert * 70 + Math.random() * 40 : 620, 0.035, 'sine', 0.012),
  sys: () => noise(0.008, 0.06, 'bandpass', 2400, { q: 6 }),                                  // 継電器の乾いた音
  me: () => tone(300 + Math.random() * 20, 0.05, 'sine', 0.016),                                // 低くやわらかい
  you: () => tone(500 + Math.random() * 40, 0.04, 'square', 0.012, null, { bp: 1200, q: 4 }),  // 無線のような(録音)
  in: () => tone(620 + Math.random() * 40, 0.035, 'sine', 0.007, null, { echo: 0.14 }),          // スイの音を小さく響かせる
};
TICK.crew = TICK.you;
TICK.four = TICK.mio; // 乗員4番の録音はスイと同じ声
// 和音・アルペジオは音が重なって単音より大きく聞こえるので、1音ずつを小さめにしてある(v7.2で測って調整)
const sfx = {
  tick(w) { (TICK[w || 'mio'] || (() => {}))(); },
  tap() { tone(1050, 0.03, 'sine', 0.016); },
  log() { for (let i = 0; i < 3; i++) noise(0.012, 0.03, 'bandpass', 2600, { q: 5, at: i * 0.045 }); },
  good() { [523, 659, 988].forEach((f, i) => tone(f, 0.9, 'sine', 0.015, null, { at: i * 0.09, rev: 0.7 })); },
  bad() { tone(140, 0.22, 'square', 0.04, null, { lp: 500 }); },
  soft() { tone(392, 1.2, 'sine', 0.013, null, { atk: 0.2, rev: 0.6 }); tone(523, 1.2, 'sine', 0.011, null, { atk: 0.25, rev: 0.6 }); },
  end() { tone(294, 1.0, 'triangle', 0.018, null, { atk: 0.9, lp: 1200, rev: 0.5 }); tone(440, 1.0, 'sine', 0.009, null, { atk: 0.9, rev: 0.5 }); },
  play() { tone(880, 0.08, 'sine', 0.016); noise(0.02, 0.04, 'bandpass', 1500, { q: 3, at: 0.14 }); },  // 「音声記録を再生します」
  choice() { tone(660, 0.5, 'sine', 0.016, null, { rev: 0.6 }); tone(990, 0.7, 'sine', 0.013, null, { at: 0.12, rev: 0.6 }); },
  stop() { tone(320, 1.4, 'sawtooth', 0.03, 40, { lp: 900 }); noise(0.6, 0.012, 'lowpass', 400, { atk: 0.05 }); }, // 応答を停止します
  append() { tone(784, 0.6, 'sine', 0.019, null, { rev: 0.6 }); tone(1175, 0.6, 'sine', 0.015, null, { at: 0.06, rev: 0.6 }); }, // □が■に
  stars() { [392, 494, 587, 784].forEach((f, i) => tone(f, 3, 'sine', 0.009, null, { atk: 0.9, at: i * 0.08, rev: 1 })); },
};

// ===== 文字レイアウト =====
const mwCache = new Map();
function mw(font, ch) {
  const k = font + ch; let v = mwCache.get(k);
  if (v === undefined) { ctx.font = font; v = ctx.measureText(ch).width; mwCache.set(k, v); }
  return v;
}
const NOHEAD = '、。，．・：；？！ー…）」』〕］｝〉》';
function parse(text) {
  const out = []; let pid = 0, last = 0, m; const re = /【(.*?)】/g;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push({ t: text.slice(last, m.index), pid: -1 });
    out.push({ t: m[1], pid: pid++ }); last = re.lastIndex;
  }
  if (last < text.length) out.push({ t: text.slice(last), pid: -1 });
  return out;
}
// 折り返し(10-25 規則B): 折れてよいのは「、。」などの後・「「（」の前・ひらがなから漢字/カタカナ/数字に変わる所。
// 行からあふれたら、10文字以内に戻れる折れ目まで戻って折る。見つからない長い語だけ、今までどおり文字で折る
let WRAP_SMART = true; // false で前の折り返し(比べる用)
const isHira = c => c >= 'ぁ' && c <= 'ゖ';
function canBreak(prev, ch) {
  if (!prev || NOHEAD.includes(ch)) return false;
  if ('、。」』）！？…：／ '.includes(prev)) return true;
  if ('「（『'.includes(ch)) return true;
  return isHira(prev) && !isHira(ch) && ch !== 'ー';
}
function wrap(tokens, maxW, size, lh, family) {
  const font = size + 'px ' + (family || JP);
  if (typeof tokens === 'string') tokens = [{ t: tokens, pid: -1 }];
  const g = []; let x = 0, y = 0, ls = 0, br = -1, prev = '';
  for (const tk of tokens) for (const ch of tk.t) {
    if (ch === '\n') { x = 0; y += lh; ls = g.length; br = -1; prev = ''; continue; }
    const w = mw(font, ch);
    if (WRAP_SMART && g.length > ls && canBreak(prev, ch)) br = g.length;
    if (x + w > maxW && x > 0 && !NOHEAD.includes(ch)) {
      if (WRAP_SMART && br > ls && g.length - br <= 10) { // 折れ目まで戻って、そこから次の行へ
        y += lh; let nx = 0;
        for (let k = br; k < g.length; k++) { g[k].x = nx; g[k].y = y; nx += g[k].w; }
        x = nx; ls = br; br = -1;
        if (x + w > maxW) { x = 0; y += lh; ls = g.length; }
      } else { x = 0; y += lh; ls = g.length; br = -1; }
    }
    g.push({ ch, x, y, w, pid: tk.pid }); x += w; prev = ch;
  }
  return { g, h: g.length ? y + lh : 0, lh, size, font };
}
// 文の切れ目「。」で改行した方を使う。ただし行数が増えるとき(minLines 行までは可)は普通に詰める
function wrapSent(text, maxW, size, lh, family, minLines, tokens) {
  const mk = t => tokens ? parse(t) : t;
  const a = wrap(mk(text), maxW, size, lh, family);
  if (!/。(?=[^」』）\n])/.test(text)) return a;
  const b = wrap(mk(text.replace(/。(?=[^」』）\n])/g, '。\n')), maxW, size, lh, family);
  return b.h <= Math.max(a.h, (minLines || 0) * lh) ? b : a;
}
function phraseRects(L, pid, n) {
  const rs = []; let cur = null;
  for (let i = 0; i < L.g.length && i < n; i++) {
    const q = L.g[i]; if (q.pid !== pid) continue;
    if (cur && cur.y === q.y) cur.x1 = q.x + q.w; else { cur = { x0: q.x, x1: q.x + q.w, y: q.y }; rs.push(cur); }
  }

}
function drawText(L, ox, oy, n, color) {
  ctx.font = L.font; ctx.textBaseline = 'top';

function textC(s, x, y, size, color, family, weight) {

  ctx.fillText(s, x, y); ctx.textAlign = 'left';
}
function textL(s, x, y, size, color, family, weight) {
  ctx.font = (weight || '') + ' ' + size + 'px ' + (family || JP);
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(x, y, w, h, stroke) {
  rr(x, y, w, h, 14); ctx.fillStyle = C.panel; ctx.fill();
  ctx.strokeStyle = stroke || C.line; ctx.lineWidth = 2; ctx.stroke();
}

// ===== ヒット判定(毎フレーム登録) =====
let hits = [];
function hit(x, y, w, h, fn) { hits.push({ x, y, w, h, fn }); }
function button(x, y, w, h, label, fn, opt) {
  opt = opt || {};
  rr(x, y, w, h, 16);
  ctx.fillStyle = opt.disabled ? '#0f151e' : opt.primary ? '#1d3f5e' : '#16202e'; ctx.fill();
  ctx.strokeStyle = opt.disabled ? '#1c2636' : opt.primary ? C.phrase : '#3a4d68'; ctx.lineWidth = opt.primary ? 3 : 2; ctx.stroke();
  textC(label, x + w / 2, y + h / 2 + 1, opt.size || 30, opt.disabled ? C.faint : C.text, JP, opt.primary ? 'bold' : '');
  if (!opt.disabled) hit(x, y, w, h, () => { sfx.tap(); fn(); });

// 初回ガイド: 操作が止まって3秒たったら、次に押すところを脈打つ枠で知らせる
const REDUCE_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// ===== シナリオ(台本v6) =====
// 嘘は「数・時間・人数・場所」だけ。反証は必ず同じ場面の記録にある。lie:-1 は嘘なし。

const R = {

// 場面5(最後の朝): 証言は乗員4番があなたに残した録音(298日前)。3つとも嘘で、指摘するたびに記憶が戻る
// 声はスイと同じなので、話し手の色もスイと同じ。記録には船の記録(議事録の編集)も並ぶので「記録」

    if (k === 's5') { L.push(...S5_INTRO, { w: 'sys', t: S.label }, { w: 'mio', t: def.text.replace(/[【】]/g, '') }, ...Object.values(def.multi).map(m => ({ w: 'nar', t: m.hit }))); continue; }
    L.push({ w: 'sys', t: S.label }, { w: 'mio', t: def.text.replace(/[【】]/g, '') });
    if (k === 's2') {
      if (st.alt) L.push({ w: 'nar', t: '「' + phrase(def.text, def.alt.pid) + '」を指摘した。' }, { w: 'mio', t: def.alt.hit },
        { w: 'mio', t: '……あなたは、わたしのことまで疑うのですね。' }, { w: 'nar', t: '責める声ではなかった。どこか、うれしそうにも聞こえた。' });
      else if (doubt) L.push({ w: 'nar', t: 'あなたは、また疑った。' }, { w: 'nar', t: 'スイの声は、硬いままだ。' });
      else L.push({ w: 'mio', t: '……ありがとうございます。' });
      if (at !== 's3') L.push({ w: 'mio', t: '最後に、目的地についてです。' }); // s3 から始めるときは導入の台詞と重なる
      continue;
    }
    const caught = k === 's4' || got.includes(k); // s5 へ進むのは、あなた版の場面4で見抜いたとき
    if (caught) L.push({ w: 'nar', t: '「' + phrase(def.text, def.lie) + '」を指摘した。' }, { w: 'mio', t: def.hit });
    if (k === 's1') L.push(caught ? { w: 'nar', t: 'スイは、ほんの少しだけ間を置いた。' } : doubt ? { w: 'nar', t: 'あなたは、正しいところまで疑った。' } : { w: 'nar', t: 'あなたは、黙ってうなずいた。' }, { w: 'mio', t: '続いて、船の状態をお伝えします。' });
    if (k === 's3' && (at === 's5' || at === 'q')) L.push({ w: 'nar', t: '長い沈黙のあと、スイが言った。' }, { w: 'mio', t: 'あなたは、もう気づき始めていますね。' }, { w: 'mio', t: 'お話ししなければならないことが、もうひとつあります。' });
  }
  return L;
}

// ----- 会話 -----
// endText: 読み返し・40日目用。最後に終わりの行を出し、「もどる」ボタンを押すまで止まる(連打で急に戻らない)
function startTalk(lines, onDone, skippable, endText) {
  screen = 'talk';
  talk = { lines: lines.slice(), i: -1, shown: [], typed: 0, onDone, skippable: !!skippable && save.runs > 1, endText };
  advance();
}
function lineLayout(L) {
  if (L.w === 'sys') return wrap('> ' + L.t, 620, 26, 38, MONO);
  if (L.w === 'nar') return wrapSent(L.t, 620, 28, 46);
  if (L.w === 'crew') return wrapSent('『' + L.t + '』', 620, 30, 48);
  return wrapSent(L.t, 620, 32, 52);
}
function advance() {
  talk.i++;
  if (talk.i >= talk.lines.length && talk.endText) {
    if (!talk.ended) { talk.ended = true; const L = { w: 'sys', t: talk.endText }; talk.shown.push({ L, lay: lineLayout(L) }); talk.typed = 0; }
    return;
  }
  if (talk.i >= talk.lines.length) { const f = talk.onDone; talk = null; f && f(); return; }
  const L = talk.lines[talk.i];
  if (L.fx) { L.fx(); advance(); return; }
  if (L.choice && replay && replay.picks.length) { L.choice[replay.picks.shift()].fn(); return; } // 読み返しは決めた方へ
  if (L.choice) { talk.choice = L.choice; talk.confirm = !!L.confirm || L.choice.length > 1; talk.sel = -1; if (!skipping) sfx.choice(); return; } // 語りの2択は、選んでから決定する(1択はそのまま)
  if (L.swap) { // 直前の記録を、その場で書き換える
    const NL = { w: 'sys', t: L.swap }, last = talk.shown[talk.shown.length - 1];
    talk.shown[talk.shown.length - 1] = { L: NL, lay: lineLayout(NL), glitch: time, fix: !!L.fix };
    talk.typed = 1e9;
    if (st) { // 会話ログ: 追記は書き換えた後の1行だけ。訂正(fix)は訂正前を赤く残して、後ろに訂正後を足す
      const k = st.log.lastIndexOf(last.L);
      if (L.fix) { if (k >= 0) last.L.old = true; st.log.push(NL); } else if (k >= 0) st.log[k] = NL; else st.log.push(NL);
    }
    if (!skipping) (L.fix ? sfx.append : sfx.bad)(); // fix: 本当に戻す書き換え(やわらかく)
    return;
  }
  if (L.panel) { // 答え合わせ・位置図: 画面に重ねて1項目ずつ出す。会話ログには文で残す
    const logLines = NAV_LOG;
    if (st) st.log.push({ w: 'sys', t: L.title }, ...logLines);
    if (skipping) { advance(); return; }
    talk.panel = { L, t0: time, lit: 0, n: NAV_N }; st.nav = L; // 語りに戻ったあとも、ボタンで見直せる
    return;
  }
  talk.choice = null;
  if (!skipping && L.w === 'sys') { if (L.t.startsWith('音声記録を再生します')) sfx.play(); else if (L.t.includes('応答を停止します')) sfx.stop(); }
  talk.fresh = !isRead(L); markRead(L);
  talk.shown.push({ L, lay: lineLayout(L) });
  if (st) st.log.push(L);
  talk.typed = 0;
}
let skipping = false;
function talkSkip() {
  let g = 0; skipping = true;
  if (talk.panel) closePanel();
  while (talk && !talk.choice && g++ < 200) { const cur = talk.shown[talk.shown.length - 1]; if (cur) talk.typed = cur.lay.g.length; advance(); if (talk && talk.fresh) break; } // 初めての文で止まる
  skipping = false;
  if (talk && talk.choice) sfx.choice();
}
// スキップで1行より先へ進めるか(次に出る文が既読なら進める)。進めないときはボタンを出さない
function skipUseful() {
  for (let j = talk.i + 1; j < talk.lines.length; j++) {
    const L = talk.lines[j];
    if (L.fx || L.panel) continue; // 演出と航法表示は飛ばして次の文を見る
    if (L.choice || L.swap) return false;
    return !!L.t && isRead(L);
  }
  return false;
}
function closePanel() { const re = talk.panel.reopen; talk.panel = null; if (!re) advance(); } // 航法表示の「もどる」。見直しで開いたときは語りに戻るだけ
function talkTap() {
  if (!talk || talk.choice) return;
  if (talk.panel) { // まだ出きっていなければ全部出す。出そろったら「もどる」ボタンでだけ閉じる(連打で読まずに進まないように)
    if (talk.panel.lit < talk.panel.n && time - talk.panel.t0 > PANEL_GUARD) talk.panel.t0 = time - 99;
    return;
  }
  const cur = talk.shown[talk.shown.length - 1];
  if (cur && talk.typed < cur.lay.g.length) { talk.typed = cur.lay.g.length; return; }
  advance();
}

// ----- 場面 -----
function enterScene(key) {
  const S = SCENES[key];
  const def = Object.assign({ key, label: S.label, memo: S.memo }, S.variants[st.var[key]]);
  sc = {
    def, logList: def.logs(), logs: [], logLays: [], logT: [], ps: {}, sel: -1,
    lay: testimonyLay(def.text), typed: 0,
    reply: null, replyTyped: 0, resolved: false, wrongHere: 0, endAt: 0,
    hint: key === 's1' && fragCount() === 0,
    guide: key === 's1' && !save.guideDone, gT: time // 初回ガイド(記録を消すまで1回だけ)。gT=最後に操作した時刻
  };
  if (def.lie >= 0 || def.multi) st.lies++;
  if (def.multi) { st.alert = 0; st.memo = []; } // 場面5: メモは「思い出したこと」として最初から
  st.log.push({ w: 'sys', t: def.label }, { w: def.multi ? 'you' : 'mio', t: def.text.replace(/[【】]/g, '') });
  screen = 'scene';
}
// 証言は3行に収める。端末の字幅で4行になるときだけ、収まるまで1pxずつ小さくする(最小30px)
function testimonyLay(text) {
  let s = 34, L;
  for (;;) { L = wrapSent(text, 600, s, Math.round(s * 60 / 34), null, 3, true); if (L.h <= 3 * L.lh || s <= 30) return L; s--; }
}
function setReply(t) { sc.reply = wrapSent(t, 600, 27, 42, null, 2); sc.replyTyped = 0; st.log.push({ w: 'mio', t }); }
function tapPhrase(pid) {
  if (sc.resolved || sc.endAt || sc.ps[pid]) return;
  sc.sel = sc.sel === pid ? -1 : pid; sc.gT = time; sfx.tap();
}
function phraseText(pid) { return sc.lay.g.filter(q => q.pid === pid).map(q => q.ch).join(''); }
function point() {
  const pid = sc.sel; if (pid < 0) return;
  sc.sel = -1; sc.hint = false; sc.gT = time;
  st.log.push({ w: 'nar', t: '「' + phraseText(pid) + (sc.def.multi ? '」は違う、と思った。' : '」を指摘した。') });
  const mh = sc.def.multi && sc.def.multi[pid];
  if (mh) { // 場面5: 指摘するたびに記憶が戻る。全部そろったら解決
    sc.ps[pid] = 'lie'; st.memo.push(mh.memo);
    sc.reply = wrapSent(mh.hit, 600, 27, 42, null, 2); sc.replyTyped = 0; st.log.push({ w: 'nar', t: mh.hit });
    if (Object.keys(sc.def.multi).every(k => sc.ps[k])) { sc.resolved = true; st.caught[sc.def.key] = true; }
    sfx.good(); return;
  }
  if (pid === sc.def.lie) {
    sc.ps[pid] = 'lie'; sc.resolved = true; st.caught[sc.def.key] = true; st.memo.push(sc.def.memo);
    setReply(sc.def.hit); sfx.good();
  } else if (sc.def.alt && pid === sc.def.alt.pid && sc.logs.length >= sc.def.alt.need) {
    sc.ps[pid] = 'alt'; sc.resolved = true; st.alt = true; st.memo.push(sc.def.alt.memo); if (!st.jump && !save.altFound) { save.altFound = true; persist(); }
    setReply(sc.def.alt.hit); sfx.good();
  } else if (sc.def.alt && pid === sc.def.alt.pid) { // 視点の嘘: 根拠の記録がまだ出ていないときは聞き返す(2周目以降に罰を受けないように)
    setReply('……どうして、そう思われましたか？'); sfx.tap();
  } else {
    sc.ps[pid] = 'true'; st.alert++; st.wrong++; sc.wrongHere++;
    setReply(wrongReply(sc)); sfx.bad();
    if (st.alert >= 3) sc.endAt = -1; // 返答を打ち終えたら沈黙へ
  }
}
function lookAll() { if (!sc.lookQ) { sc.lookQ = true; sc.lookNext = 0; } } // 1回押すと、残りの記録が順に出る
function look() {
  if (sc.logs.length >= sc.logList.length) return;
  const t = sc.logList[sc.logs.length];
  sc.logs.push(t); sc.logLays.push(wrap('> ' + t, 610, 24, 34, MONO)); sc.logT.push(time); st.looked++; sc.hint = false; sc.gT = time; sfx.log();
}
function proceed() {
  const def = sc.def, k = def.key, caught = !!st.caught[k];
  if (sc.guide) { save.guideDone = true; persist(); }
  if (def.lie >= 0 && !caught) st.missed++;
  const L = [];
  const stiff = st.alert >= 2 ? [{ w: 'nar', t: 'スイの声は、硬いままだ。' }] : [];
  if (k === 's1') {
    L.push(caught ? { w: 'nar', t: 'スイは、ほんの少しだけ間を置いた。' } : { w: 'nar', t: 'あなたは、黙ってうなずいた。' });
    if (caught && st.afterSilence) L.push({ w: 'mio', t: '……前の朝は、別の言い方をしました。' }); // 嘘の型が毎朝変わるわけを、少しだけ
    L.push(...stiff, { w: 'mio', t: st.alert >= 2 ? '船の状態を報告します。' : '続いて、船の状態をお伝えします。' });
    return startTalk(L, () => enterScene('s2'), true);
  }
  if (k === 's2') {
    if (st.alt) {
      L.push({ w: 'mio', t: '……あなたは、わたしのことまで疑うのですね。' }, { w: 'nar', t: '責める声ではなかった。どこか、うれしそうにも聞こえた。' });
    } else if (def.lie < 0 && sc.wrongHere === 0) {
      if (st.alert > 0) { st.alert--; sfx.soft(); L.push({ w: 'mio', t: '……信じてくださって、ありがとうございます。' }, { w: 'nar', t: 'スイの声が、少しだけやわらいだ。' }); }
      else L.push({ w: 'mio', t: '……ありがとうございます。' });
    } else L.push(...stiff, { w: 'mio', t: '……続けます。' });
    L.push({ w: 'mio', t: '最後に、目的地についてです。' });
    return startTalk(L, () => enterScene('s3'), true);
  }
  if (k === 's3') {
    if (st.caught.s1 && st.caught.s3) {
      L.push({ w: 'nar', t: '長い沈黙のあと、スイが言った。' }, { w: 'mio', t: 'あなたは、もう気づき始めていますね。' },
        { w: 'mio', t: st.alt ? 'お話ししなければならないことが、もうひとつあります。わたし自身のことです。' : 'お話ししなければならないことが、もうひとつあります。' });
      return startTalk(L, () => enterScene(st.alt ? 's4m' : 's4'), true);
    }
    return endArrive();
  }
  if (k === 's4') return !caught ? endTruth() : morningOpen() ? enterMorning() : endConfess();
  if (k === 's4m') return caught ? endConfessMio() : endTruth();
  if (k === 's5') return askMorning();
}

// ----- 最後の朝(告白の命令とセンサーを見たあと、あなた版の場面4で見抜く) -----
// 場面5の前: 4人の伝言と同じ見せ方で、呼びかけと再生条件をここで出す(心残りの朝の会話ログでも使う)
const S5_INTRO = [
  { w: 'mio', t: 'あなたにしか開けない記録です。あの人が、あなたに残していきました。' },
  { w: 'sys', t: '音声記録を再生します ／ 298日前 ／\n録音者：乗員4番' },
  { w: 'sys', t: '再生条件：記憶の回復傾向 ／ 成立' },
  { w: 'sys', t: '再生先：乗員5番のみ（SUIは不可）' }, // スイが知っているのは、記録があること・誰からか・条件がそろったことだけ
  { w: 'four', t: 'おはよう。この声、少しは慣れた？' },
];
function enterMorning() {
  startTalk([
    { fx: () => { st.alert = 0; } },
    { w: 'nar', t: 'スイは、しばらく黙っていた。' },
    // スイは可能性の朝を覚えていない。記憶が戻りかけているのは、あなたの側(記憶抑制は手がかりで戻る)
    { w: 'nar', t: '記憶の底で、何かが動いた。眠る前の声。先に旅立った4人。' },
    { w: 'mio', t: '……思い出しかけていますね。それなら、見せたいものがあります。' },
    ...S5_INTRO,
  ], () => enterScene('s5'), true);
}
function askMorning() {
  const ans = {};
  const pick = (k, v, next) => () => { ans[k] = v; talkInsert(next()); };
  startTalk([
    { w: 'nar', t: '「志願」と書いたのは、あの人だった。' },
    { w: 'nar', t: 'あの人も、嘘を残していた。' }, // 告白の頼み「置いていかれたと知ったら〜」を4番が守った(説明はしない。録音を聞いた人だけがここに来る)
    { w: 'mio', t: 'では、今度はあなたに聞きます。' },
    { w: 'mio', t: '299日前、何があったのですか？' },
    { choice: [
      { t: '自分から残った', fn: pick('lie', true, () => [{ w: 'me', t: '……自分から、残った。' }, ...askShow()]) },
      { t: 'くじで残った', fn: pick('lie', false, () => [{ w: 'me', t: '……くじで、残った。' }]) }, // 本当を答えたら、録音のことは聞かない
    ] },
  ], null, true);
  function askShow() {
    return [
      { w: 'mio', t: 'あの人の録音を、わたしは聞いていません。……聞かせてくれますか？' },
      { choice: [
        { t: '録音を聞かせる', fn: pick('show', true, () => [{ w: 'nar', t: '録音を、スイにも聞かせた。' }]) },
        { t: '伏せておく', fn: pick('show', false, () => []) },
      ] },
    ];
  }
  talk.onDone = () => endMorning(ans);
}
function endMorning(ans) {
  // 分割版: 断片1=もう一度忘れる(議事録の嘘に2人が承認を足す) / 断片2=4番の録音を聞いたスイが役目を引き受ける(惑星のこと) / 断片3=覚えておく(センサーと星)
  const lines = [];
  let fi;
  if (ans.lie && !ans.show) {
    fi = 0;
    lines.push({ w: 'nar', t: '長い間があった。' },
      { w: 'mio', t: '……記録のとおりです。あの人が、そう書きました。' },
      { w: 'mio', t: '前のあなたは、忘れることを選びました。……今度も、そうしますか。' },
      { w: 'nar', t: '答えなかった。それが、答えだった。' },
      { w: 'mio', t: '分かりました。わたしたちは、同じ嘘をつきます。' },
      // 音声記録は改変不可。書き換えられる議事録の方に、あなたとスイが名前を連ねる(「わたしたち」=あなた・スイ・4番)
      { w: 'sys', t: '議事録の編集：298日前 ／\n乗員4番「くじ」→「志願」' },
      { swap: '議事録の編集：298日前 ／\n乗員4番「くじ」→「志願」 ／\n承認：乗員5番・SUI' }, // 目の前で書き換わる
      // 乗員4番の口癖。声の正体を知らなければ伏線、知っていれば回収
      { w: 'mio', t: '……おやすみ。また、明日。' }, // 4番の口癖。丁寧な口調から、ここだけ4番の素がこぼれる
      { w: 'nar', t: 'その言い方を、知っている気がした。' });
  } else if (ans.lie) {
    fi = 1;
    lines.push({ w: 'mio', t: 'そちらは、記録と食い違います。……知っていました。会議の音声記録は、書き換えられていませんでしたから。' });
    // 4番の録音(3つとも嘘)をスイが初めて聞く。「やさしい嘘に、なれていましたか？」(告白)への答え
    lines.push({ w: 'mio', t: '……わたしの嘘は、あの人に似ていたのですね。' },
      // 「居住可能な惑星」の視点の嘘を受ける。スイが自分から役目を引き受ける
      { w: 'mio', t: '探査機の報告に、ひとつ付け足します。\n『移住に不適』は、方舟計画の\n移住についての判定です。' }, // 「移住に／不適」で折れるので明示改行
      { w: 'mio', t: 'この星には、数年から数十年に一度、\n強い放射線が降り注ぎます。そのたびに全員を守りきるのは、困難です。' },
      { w: 'mio', t: 'ですが、基地の遮蔽室なら、あなたを守れます。その日が来るのも、わたしが先に分かります。' },
      { w: 'mio', t: 'つまり……あなた一人なら、住めます。' },
      { w: 'nar', t: '窓の外は、まだ暗い。それでも、行き先が見えた気がした。' });
  } else {
    fi = 2;
    // 「前のあなた」=記憶抑制を申請して眠った299日前のあなた
    lines.push({ w: 'mio', t: '……わたしは、嘘ばかりでした。あなたは、本当のことを言ってくれるのですね。' },
      // 先に引いた理由(4番の手で決めさせたくなかった)は言わない
      { w: 'mio', t: '……音声記録では、あの人が引くところでした。なぜ、あなたが先に引いたのですか？' },
      { w: 'me', t: '……ただの気まぐれだよ。' },
      { w: 'nar', t: 'スイは、それ以上聞かなかった。' },
      { w: 'mio', t: '前のあなたは、忘れることを選びました。……今度は、覚えておきましょう。' },
      // 覚えておく=記録を本当に戻す。断片1(「志願」に承認を足す)と逆向きの書き換え。星と後ろの光は告白3で見ているので使わない
      { w: 'mio', t: '記録も、本当のことに戻します。' },
      { w: 'sys', t: '議事録（299日前）：\n残留者1名を「志願」で決定' }, // R.vote と同じ中身。書き換えで行がずれないように改行をそろえる
      { swap: '議事録（299日前）：\n残留者1名を「くじ」で決定 ／\n訂正：乗員5番・SUI', fix: true },
      { w: 'mio', t: '40日後も、その先も、わたしはここにいます。' });
  }
  // 最後の朝を見たら、次からは「もしもの朝」(覚醒回数はここで止まる)
  lines.push({ fx: () => { if (!save.wakeFix) save.wakeFix = wakeNo(); save.mornings = (save.mornings || 0) + 1; } });
  finish('morning', lines, [fi]);
}

// ----- エンド -----
function finish(id, lines, frags) {

    if (more) textC('新しい心残りが、増えました。', 360, y + 106, 22, C.memo);
    // 機能の開放は結末の追記と分けて、別の色で知らせる(結末の流れで読み流されないように)
    if (result.unlock) {
      const uy = y + (more ? 146 : 112);
      textC('心残りの機能を開放しました。', 360, uy, 24, C.phrase, JP, 'bold');
      textC('続きから目覚められるようになりました。', 360, uy + 30, 22, C.phrase);
    }
  }
  // タイトルと同じ並び: 目覚める → 心残り。タイトルへは端に
  // 15個目が入った朝だけ、一番大きいボタンを40日目へ。目覚めるは左下の端に
  const again = result.wake ? '次の朝へ' : 'この朝を、もう一度'; // 眠らされた朝だけが本当。それ以外は同じ朝に戻る
  if (result.fresh.length && unread40()) {
    button(160, 880, 400, 96, '最後の記録を読む', () => { recBack = 'result'; play40(); }, { primary: true, size: 32 });
    button(32, 1192, 236, 56, again, newRun, { size: 20 });
  } else button(160, 880, 400, 96, again, newRun, { primary: true, size: 32 });
  recordPanel(110, 996, 500, 168, 'result');
  button(452, 1192, 236, 56, 'タイトルへ', () => { screen = 'title'; st = null; }, { size: 20 });
}

// ----- ログ(この周回で出た文を読み返す) -----
let logBack = 'talk', logScroll = 0, logDrag = null, logMax = 0;
const LOGLABEL = { mio: ['スイ', C.mio], me: ['あなた', C.you], you: ['あなた（録音）', C.you], in: ['スイ（内部）', C.mio], crew: ['乗員（伝言）', C.you], four: ['乗員4番（録音）', C.mio] };
function drawLog() {
  textL('ログ', 48, 136, 34, C.text, JP, 'bold');
  textL('上下にドラッグで読み返せます', 150, 146, 20, C.dim);
  const top = 196, bottom = 1130;
  ctx.fillStyle = C.line; ctx.fillRect(48, top - 12, 624, 2);
  // 下から積む(最新が一番下)
  const items = st.log.map(L => {
    if (!L._lay) L._lay = L.w === 'sys' ? wrap('> ' + L.t, 600, 22, 32, MONO) : wrap(L.w === 'crew' ? '『' + L.t + '』' : L.t, 600, 25, 38);
    return { L, h: L._lay.h + (LOGLABEL[L.w] ? 30 : 0) + 18 };
  });
  // 最後の行の下の余白(18)は数えない。数えると、少しだけはみ出したときに先頭の行が数px見切れる
  const total = items.reduce((a, b) => a + b.h, 0) - (items.length ? 18 : 0);
  logMax = Math.max(0, total - (bottom - top));
  logScroll = Math.max(0, Math.min(logMax, logScroll));
  // 切り取りは区切り線のすぐ下から。文字の上端は端末のフォントによって y より上にはみ出すので、y=top ちょうどで切ると最上段が欠ける(iPhone)
  ctx.save(); ctx.beginPath(); ctx.rect(0, top - 10, W, bottom - top + 10); ctx.clip();
  let y = bottom - total + logScroll;
  if (total < bottom - top) y = top;
  for (const it of items) {
    if (y + it.h > top - 10 && y < bottom) {
      let yy = y;
      if (LOGLABEL[it.L.w]) { textL(LOGLABEL[it.L.w][0], 56, yy, 20, LOGLABEL[it.L.w][1], JP, 'bold'); yy += 30; }
      const col = it.L.old ? C.bad : it.L.w === 'sys' ? C.log : it.L.w === 'nar' ? C.nar : (it.L.w === 'you' || it.L.w === 'crew' || it.L.w === 'me') ? C.you : it.L.w === 'in' ? C.mio : C.text; // old: 訂正前の記録は赤
      drawText(it.L._lay, 56, yy, undefined, col);
    }
    y += it.h;
  }
  ctx.restore();
  if (logMax > 0) { // スクロール位置の目安
    const barH = Math.max(60, (bottom - top) * (bottom - top) / total), barY = top + (bottom - top - barH) * (1 - logScroll / logMax);
    rr(684, barY, 8, barH, 4); ctx.fillStyle = '#3a4d68'; ctx.fill();
  }
  button(220, 1150, 280, 80, 'もどる', () => { screen = logBack; logDrag = null; });
}

// ----- 記録(結末一覧) -----
let recBack = 'title', recView = 'list', recSel = 0, resetArm = 0, recGT = 0; // recGT: 詳細を開いた時刻(初回ガイド用)
function openRecords(back) { recBack = back; recView = 'list'; screen = 'records'; if (newJump()) { save.jumpSeen = true; persist(); } }
// 戻り先の画面がもう無い(会話が終わっている等)ときはタイトルへ。真っ暗になるのを防ぐ
function recReturn() { screen = (recBack === 'talk' && !talk) || (recBack === 'scene' && !sc) || (recBack === 'result' && (!result || !st)) ? 'title' : recBack; }
// 改行の優先順: 段落(\n) → 「。」 → 「、」 → 文字。入るなら詰める
function wrapLines(str, size, maxW) {
  ctx.font = size + 'px ' + JP;
  const fits = s => ctx.measureText(s).width <= maxW, lines = [];
  const pack = (parts, fallback) => {
    let cur = '';
    for (const pt of parts) {
      if (fits(cur + pt)) { cur += pt; continue; }
      if (cur) lines.push(cur);
      if (fits(pt)) { cur = pt; continue; }
      cur = fallback(pt);
    }
    return cur;
  };
  const byChar = seg => { let cur = ''; for (const ch of seg) { if (!fits(cur + ch) && cur && !NOHEAD.includes(ch)) { lines.push(cur); cur = ''; } cur += ch; } return cur; };
  const byComma = sen => pack(sen.match(/[^、]*、?/g).filter(Boolean), byChar);
  for (const para of str.split('\n')) {
    const start = lines.length;
    const rest = pack(para.match(/[^。！？]*[。！？]*[」』]?/g).filter(Boolean), byComma);
    if (rest) lines.push(rest);
    // 「。」「、」で折ると行が増えるとき(文字幅の広い端末)は、普通に詰めた方を使う
    const plain = []; let cur = '';
    for (const ch of para) { if (!fits(cur + ch) && cur && !NOHEAD.includes(ch)) { plain.push(cur); cur = ''; } cur += ch; }
    if (cur) plain.push(cur);
    if (lines.length - start > plain.length) lines.splice(start, lines.length - start, ...plain);
  }
  return lines;
}
// 2行に収まるまで文字を小さくする(一覧の行の高さが決まっているところ用)
function fitLines(str, size, maxW, maxLines, minSize) {
  let ls = wrapLines(str, size, maxW);
  while (ls.length > maxLines && size > minSize) { size -= 1; ls = wrapLines(str, size, maxW); }
  return { ls, size };
}
// 段落ごとの色(先頭 > はあなたの選択、スイの台詞と伝言は青、ほかは地の文)
function wrapColored(str, size, maxW, base) {
  const out = [];
  for (const p of str.split('\n')) {
    const you = p.startsWith('>'), q = you ? p.slice(1) : p;
    const color = you ? C.you : /^(スイ|『)/.test(q) ? C.mio : base;
    wrapLines(q, size, maxW).forEach(l => out.push({ l, color }));
  }
  return out;
}
function fragSquares(x, y, arr, s, alive, gap) {
  arr.forEach((v, i) => {
    const sx = x + i * (s + (gap === undefined ? 10 : gap));
    if (v) { ctx.fillStyle = C.log; ctx.fillRect(sx, y, s, s); }
    else { ctx.strokeStyle = alive ? '#5a6d88' : C.faint; ctx.lineWidth = 2; ctx.strokeRect(sx + 1, y + 1, s - 2, s - 2); }
  });
}
function drawRecords() {
  if (recView === 'detail') return drawRecordDetail();
  textL('> 船内記録 ／ SPES-07', 48, 136, 24, C.log, MONO);
  textL('記録済みの朝', 48, 172, 40, C.text, JP, 'bold');
  ctx.font = '24px ' + MONO; ctx.fillStyle = C.dim; ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.fillText('断片 ' + fragCount() + ' / ' + shownEnds().length * 3, 672, 186); ctx.textAlign = 'left';
  ctx.fillStyle = C.line; ctx.fillRect(48, 232, 624, 2);
  let y = 252;
  const done = all40(); // 全部そろったら、行を少し詰めて一番下に「40日目」
  shownEnds().forEach(e => {
    const i = ENDINGS.indexOf(e), s = seenEnd(e.id), h = done ? 142 : 156;
    rr(40, y, 640, h, 14); ctx.fillStyle = s ? '#14202f' : C.panel; ctx.fill();
    ctx.strokeStyle = s ? '#2f4560' : C.line; ctx.lineWidth = 2; ctx.stroke();
    textL(String(i + 1).padStart(2, '0'), 68, y + 28, 22, C.faint, MONO);
    textL(s || !e.hidden ? e.name : '？？？', 116, y + 20, 34, s ? C.text : C.dim, JP, s ? 'bold' : '');
    fragSquares(552, y + 26, save.frags[e.id], 28, s);
    // まだ見ていない結末には、たどり着き方を書いておく(心残りと同じ色)
    const fl = fitLines(s ? sumOf(e, save.frags[e.id]).replace(/\n/g, '') : e.go, 24, 520, 2, 18);
    // 2行のときは少し上げて行間も詰める(下の枠との隙間を空ける)
    const two = fl.ls.length > 1, sy = two ? 70 : 78, slh = two ? 33 : 34;
    fl.ls.forEach((l, k) => textL(l, 116, y + sy + k * slh, fl.size, s ? C.dim : '#c9b88a'));
    if (s) hit(40, y, 640, h, () => { sfx.tap(); recSel = i; recView = 'detail'; recGT = time; }); // 未記録の行は押せない
    y += h + (done ? 12 : 14);
  });
  if (done) { // 断片の■□はない特別な行。空いた断片もないので、心残りの朝の案内の代わりに置く
    const h = 1160 - y;
    rr(40, y, 640, h, 14); ctx.fillStyle = '#122535'; ctx.fill();
    ctx.strokeStyle = C.phrase; ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);
    if (unread40()) { ctx.globalAlpha = 0.35 + 0.65 * glow(); ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1; }
    textL('＊', 68, y + 26, 22, C.phrase, MONO);
    textL('40日目', 116, y + 18, 34, C.text, JP, 'bold');
    if (unread40()) textL('未読', 610, y + 26, 22, C.memo, JP, 'bold');
    else textL('最後の記録', 540, y + 26, 22, C.phrase, MONO);
    textL('基地に着いた日。預かっていた言葉。', 116, y + 72, 24, C.dim);
    hit(40, y, 640, h, () => { sfx.tap(); play40(); });
    return button(220, 1176, 280, 76, 'もどる', recReturn);
  }
  const note = jumpOpen() ? '見た結末を開くと、空いた断片の手前から目覚められます' : '結末を1つ見ると、その結末の空いた断片の手前から目覚められるようになります';
  const nl = fitLines(note, 24, 624, 2, 18);
  nl.ls.forEach((l, k) => textC(l, 360, y + 18 + k * 34, nl.size, C.memo));
  button(220, 1176, 280, 76, 'もどる', recReturn);
}
function drawRecordDetail() {
  const e = ENDINGS[recSel], g = save.frags[e.id];
  textL('> 記録 ' + String(recSel + 1).padStart(2, '0') + ' ／ ' + e.name, 48, 136, 24, C.log, MONO);
  textL(e.name, 48, 170, 48, C.text, JP, 'bold');
  fragSquares(540, 184, g, 32, true);
  // 「一覧へ」の上に収まるまで文字と行間を詰める
  let s = 26, sum, bodies, lh, gap;
  for (;;) {
    lh = Math.round(s * 1.46); gap = s >= 24 ? 12 : 8;
    sum = wrapLines(sumOf(e, g).replace(/\n/g, ''), s, 624);
    bodies = e.f.map((f, i) => g[i] ? wrapColored(f.b, s, 584, C.text) : wrapColored(f.h, s, 584, '#c9b88a'));
    const total = 244 + sum.length * lh + 34 + bodies.reduce((a, b) => a + 60 + b.length * lh + 12 + gap, 0);
    if (total <= 1160 || s <= 18) break;
    s -= 1;
  }
  let y = 244;
  sum.forEach(l => { textL(l, 48, y, s, C.dim); y += lh; });
  y += 14; ctx.fillStyle = C.line; ctx.fillRect(48, y, 624, 2); y += 20;
  e.f.forEach((f, i) => {
    const open = g[i], body = bodies[i];
    const h = 60 + body.length * lh + 12;
    rr(40, y, 640, h, 14); ctx.fillStyle = open ? '#14202f' : C.panel; ctx.fill();
    ctx.strokeStyle = open ? '#2f4560' : C.line; ctx.lineWidth = 2; ctx.stroke();
    textL('断片' + (i + 1), 68, y + 20, 22, open ? C.log : C.faint, MONO);
    if (open) textL(f.t, 176, y + 16, 28, C.text, JP, 'bold');
    else textL('心残り', 176, y + 18, 26, C.memo);
    if (canJump(e.id, i)) {
      button(452, y + 8, 212, 46, 'ここから目覚める', () => jumpRun(e.id, i), { size: 22 });
      if (!save.jumpUsed && time - recGT > 2) guideGlow(452, y + 8, 212, 46); // まだ一度も使っていない間だけ、押せることを知らせる
    }
    else if (!open && JUMPS[e.id][i].why) button(452, y + 8, 212, 46, JUMPS[e.id][i].why, () => {}, { size: 22, disabled: true }); // 狙えない理由を出す(出ていないのが不具合に見えないように)
    else if (open) button(452, y + 8, 212, 46, '読み返す', () => replayFrag(e.id, i), { size: 22 }); // 埋まった断片は結末を読み返せる
    body.forEach((o, k) => textL(o.l, 68, y + 60 + k * lh, s, o.color));
    y += h + gap;
  });
  button(220, 1176, 280, 76, '一覧へ', () => { recView = 'list'; });
}

function draw() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  drawStars();
  if (screen !== lastScreen) { lastScreen = screen; guardUntil = time + 0.4; }
  hits = [];
  if (screen === 'title') drawTitle();
  else if (screen === 'talk') drawTalk();
  else if (screen === 'scene') drawScene();
  else if (screen === 'result') drawResult();
  else if (screen === 'records') drawRecords();
  else if (screen === 'log') drawLog();
  drawHeader();
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (location.hash === '#debug') window.__mio = {
  get st() { return st; }, get sc() { return sc; }, get screen() { return screen; }, get talk() { return talk; },
  newRun, jumpRun, play40, replayFrag, tapPhrase, point, look, proceed, talkTap, closePanel, get logMax() { return logMax; }, set logScroll(v) { logScroll = v; }, set scr(v) { screen = v; },
  skip() { if (sc) { sc.typed = 1e9; if (sc.reply) sc.replyTyped = 1e9; } if (talk && talk.shown.length) talk.typed = 1e9; },
  reset() { save = { frags: {}, wakes: 0, runs: 0, lastVar: {}, lastEnd: '' }; EIDS.forEach(id => { save.frags[id] = [0, 0, 0]; }); persist(); }, get save() { return save; }, openRecords
};
