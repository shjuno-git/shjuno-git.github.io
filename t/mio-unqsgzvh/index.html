let ac = null, muted = false, verb = null, noiseBuf = null;

const tame = (f, type) => (f > 600 ? Math.pow(600 / f, 0.8) : 1) * (type === 'square' || type === 'sawtooth' ? 0.6 : 1);

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime((vol || 0.04) * tame(f, type), t + (o.atk || 0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  let node = osc;
  if (o.lp || o.bp) { const fl = ac.createBiquadFilter(); fl.type = o.lp ? 'lowpass' : 'bandpass'; fl.frequency.value = o.lp || o.bp; fl.Q.value = o.q || 1; osc.connect(fl); node = fl; }

  if (o.rev) { const s = ac.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(verb); }

}
function noise(d, vol, type, freq, o) {
  if (muted || !ac) return;
  o = o || {};

  s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
}

const mwCache = new Map();
function mw(font, ch) {
  const k = font + ch; let v = mwCache.get(k);
  if (v === undefined) { ctx.font = font; v = ctx.measureText(ch).width; mwCache.set(k, v); }
  return v;
}
const NOHEAD = '、。，．・：；？！ー…）」』〕］｝〉》';
function parse(text) {
  const out = []; let pid = 0, last = 0, m; const re = /【(.*?)】/g;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push({ t: text.slice(last, m.index), pid: -1 });
    out.push({ t: m[1], pid: pid++ }); last = re.lastIndex;
  }
  if (last < text.length) out.push({ t: text.slice(last), pid: -1 });
  return out;
}

let WRAP_SMART = true;
const isHira = c => c >= 'ぁ' && c <= 'ゖ';

function canBreak(prev, ch) {
  if (!prev || NOHEAD.includes(ch)) return false;
  if ('、。」』）！？…／ '.includes(prev)) return true;
  if ('「（『'.includes(ch)) return true;
  return isHira(prev) && !isHira(ch) && ch !== 'ー';
}

const punctBreak = (pp, prev, ch) => !NOHEAD.includes(ch) && ('、。？！'.includes(prev) || (prev === '／' && ch !== ' ') || (prev === ' ' && pp === '／'));
function wrap(tokens, maxW, size, lh, family) {
  const font = size + 'px ' + (family || JP);
  if (typeof tokens === 'string') tokens = [{ t: tokens, pid: -1 }];
  const g = []; let x = 0, y = 0, ls = 0, br = -1, pb = -1, prev = '', pp = '';
  for (const tk of tokens) for (const ch of tk.t) {
    if (ch === '\n') { x = 0; y += lh; ls = g.length; br = -1; pb = -1; prev = ''; pp = ''; continue; }
    const w = mw(font, ch);
    if (WRAP_SMART && g.length > ls && canBreak(prev, ch)) br = g.length;
    if (WRAP_SMART && g.length > ls && punctBreak(pp, prev, ch)) pb = g.length;
    if (x + w > maxW && x > 0 && !NOHEAD.includes(ch)) {

      const pbx = pb < g.length ? (g[pb] ? g[pb].x : 0) : x;
      const cut = WRAP_SMART && pb > ls && pbx >= maxW * 0.35 ? pb : WRAP_SMART && br > ls && g.length - br <= 10 ? br : -1;
      if (cut > 0) {
        y += lh; let nx = 0;
        for (let k = cut; k < g.length; k++) { g[k].x = nx; g[k].y = y; nx += g[k].w; }
        x = nx; ls = cut; br = br > cut ? br : -1; pb = pb > cut ? pb : -1;
        if (x + w > maxW) { x = 0; y += lh; ls = g.length; br = -1; pb = -1; }
      } else { x = 0; y += lh; ls = g.length; br = -1; pb = -1; }
    }
    g.push({ ch, x, y, w, pid: tk.pid }); x += w; pp = prev; prev = ch;
  }
  return { g, h: g.length ? y + lh : 0, lh, size, font };
}

function wrapSent(text, maxW, size, lh, family, minLines, tokens) {
  const mk = t => tokens ? parse(t) : t;
  const a = wrap(mk(text), maxW, size, lh, family);
  if (!/。(?=[^」』）\n])/.test(text)) return a;
  const b = wrap(mk(text.replace(/。(?=[^」』）\n])/g, '。\n')), maxW, size, lh, family);
  return b.h <= Math.max(a.h, (minLines || 0) * lh) ? b : a;
}
function phraseRects(L, pid, n) {
  const rs = []; let cur = null;
  for (let i = 0; i < L.g.length && i < n; i++) {

    if (cur && cur.y === q.y) cur.x1 = q.x + q.w; else { cur = { x0: q.x, x1: q.x + q.w, y: q.y }; rs.push(cur); }

}

  for (let i = 0; i < lim; i++) {

    ctx.fillText(q.ch, ox + q.x, oy + q.y);

}

  ctx.fillText(s, x, y); ctx.textAlign = 'left';
}

    textL(String(i + 1).padStart(2, '0'), 64, y + 22, 22, C.faint, MONO);
    const sqX = 652 - g.length * 34 + 8;
    const nm = rowName(e), nMax = Math.min(430, sqX - 14 - 108 - 12); let ns = 30; ctx.font = 'bold ' + ns + 'px ' + JP; while (ctx.measureText(nm).width > nMax && ns > 20) { ns--; ctx.font = 'bold ' + ns + 'px ' + JP; }
    textL(nm, 108, y + 16, ns, s ? C.text : C.dim, JP, s ? 'bold' : '');
    fragSquares(sqX, y + 20, g, 26, s, 8);

    const fl = fitLines(rowLine(e), 24, 540, 2, 18);
    const two = fl.ls.length > 1, sy = h - (two ? 62 : 44), slh = two ? 31 : 34;
    fl.ls.forEach((l, k) => textL(l, 108, y + sy + k * slh, fl.size, half || !s ? C.wish : C.dim));
    if (s) hit(40, y, 640, h, () => { sfx.tap(); recSel = i; recView = 'detail'; recGT = time; });
    y += h + 10;
  });
  if (allDeep() && !clear()) {
    y += 2; ctx.fillStyle = C.line; ctx.fillRect(48, y, 624, 2); y += 16;
    rr(40, y, 640, 96, 14); ctx.fillStyle = C.panel; ctx.fill();
    ctx.globalAlpha = 0.45 + 0.55 * glow(); ctx.strokeStyle = C.memo; ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    textL('？？？', 68, y + 12, 30, C.memo, JP, 'bold');
    ctx.strokeStyle = C.memo; ctx.lineWidth = 2; ctx.strokeRect(627, y + 19, 24, 24);
    textL('もし、すべての記録が添えられたら。', 68, y + 56, 22, '#c9b88a');
    y += 106;
  }
  if (clear()) {
    y += 2; ctx.fillStyle = C.line; ctx.fillRect(48, y, 624, 2);
    if (after()) {
      nameY = y + 12;
      y += 50;
    } else y += 16;
    const row = (name, line, fn, unread, sq) => {
      const h = 120;
      rr(40, y, 640, h, 14); ctx.fillStyle = '#241f14'; ctx.fill();
      ctx.strokeStyle = C.memo; ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);
      if (unread) { ctx.globalAlpha = 0.35 + 0.65 * glow(); ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1; }
      textL(name, 68, y + 16, 30, C.text, JP, 'bold');
      if (sq) fragSquares(626, y + 20, [1], 26, true);
      textL(line, 68, y + 74, 22, C.dim);

      button(452, y + 11, 158, 44, unread ? '▶ 読む' : '▶ 読み返す', fn, { size: 22, primary: true, gold: true, hitX: 12, hitY: 14 });
      y += h + 10;
    };
    row('本当の朝', '「志願」を、自分の手で「くじ」に直した。', playHonbanRead, false, true);
    row('40日後', after() ? '伝言と、もうひとつの記録。' : 'まだ読んでいない記録があります。', () => start40(true), !after());
  }
  button(220, 1176, 280, 76, recBack === 'after' ? 'タイトルへ' : 'もどる', recReturn, { primary: recBack === 'after' && !rwLock, disabled: rwLock });
  if (rwDim) { ctx.globalAlpha = rwDim; ctx.fillStyle = '#05080d'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; rwHead(); }
  if (nameY >= 0) {
    const a = rwSm((rw - RW_NAME) / 0.45);
    ctx.save(); ctx.globalAlpha = a;
    if (rw < RW_END + 0.2) { ctx.shadowColor = C.memo; ctx.shadowBlur = 36 * Math.sin(Math.PI * Math.max(0, Math.min(1, (rw - RW_NAME) / 0.9))); }
    textL('あなたの記録', 48, nameY + 14 * (1 - a), 26, C.memo, JP, 'bold');
    ctx.restore();
  }
  if (rwLock) hits.length = h0;
}
function drawRecordDetail() {
  const e = ENDINGS[recSel], g = save.frags[e.id];
  const nm = rowName(e);
  textL('> 記録 ' + String(recSel + 1).padStart(2, '0') + ' ／ ' + nm, 48, 136, 24, C.log, MONO);
  let ns = 44; ctx.font = 'bold ' + ns + 'px ' + JP; while (ctx.measureText(nm).width > 470 && ns > 28) { ns -= 2; ctx.font = 'bold ' + ns + 'px ' + JP; }
  textL(nm, 48, 172, ns, C.text, JP, 'bold');
  fragSquares(672 - g.length * 42 + 10, 184, g, 32, true);

  let s = 26, sum, bodies, lh, gap;
  for (;;) {
    lh = Math.round(s * 1.46); gap = s >= 24 ? 12 : 8;
    sum = wrapLines(rowLine(e), s, 624);
    bodies = e.f.map((f, i) => g[i] ? wrapColored(fragBody(e, i), s, 584, C.text) : wrapColored(f.h || '', s, 584, C.wish));
    const total = 244 + sum.length * lh + 34 + bodies.reduce((a, b) => a + 72 + b.length * lh + 12 + gap, 0);
    if (total <= 1160 || s <= 18) break;
    s -= 1;
  }
  let y = 244;
  sum.forEach(l => { textL(l, 48, y, s, C.dim); y += lh; });
  y += 14; ctx.fillStyle = C.line; ctx.fillRect(48, y, 624, 2); y += 20;
  e.f.forEach((f, i) => {
    const open = g[i], body = bodies[i];
    const h = 72 + body.length * lh + 12;
    rr(40, y, 640, h, 14); ctx.fillStyle = open ? '#14202f' : C.panel; ctx.fill();
    ctx.strokeStyle = open ? '#2f4560' : C.line; ctx.lineWidth = 2; ctx.stroke();
    if (open) textL(f.t, 68, y + 16, 28, C.text, JP, 'bold');
    else textL('心残り', 68, y + 18, 26, C.phrase);
    ctx.fillStyle = open ? '#2f4560' : C.line; ctx.fillRect(60, y + 62, 600, 2);
    if (canJump(e.id, i)) {
      button(452, y + 8, 212, 46, 'ここから目覚める', () => jumpRun(e.id, i), { size: 22, primary: true, hitX: 12, hitY: 14 });
      if (glow() > 0.5 || REDUCE_MOTION) guideGlow(452, y + 8, 212, 46);
    }
    else if (open) button(452, y + 8, 212, 46, '▶ 読み返す', () => replayFrag(e.id, i), { size: 22, primary: g.every(Boolean), hitX: 12, hitY: 14 });
    body.forEach((o, k) => textL(o.l, 68, y + 72 + k * lh, s, o.color));
    y += h + gap;
  });
  button(220, 1176, 280, 76, '一覧へ', () => { recView = 'list'; });
}

function draw() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  drawStars();
  if (screen !== lastScreen) { lastScreen = screen; guardUntil = time + 0.4; }
  hits = []; eyeOverride = null;
  if (screen === 'title') drawTitle();
  else if (screen === 'talk') drawTalk();
  else if (screen === 'scene') drawScene();
  else if (screen === 'result') drawResult();
  else if (screen === 'records') drawRecords();
  else if (screen === 'log') drawLog();
  drawHeader();
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
